<style>
/* 25/11 (Cris): página de isca do Instagram @blrdevelopment. Inspirada no funil da Link Realty (form em 2 passos, call grátis,

:root{--bg:#0b0d11;--bg2:#12151b;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.085);--ink:#f3f1ec;--mute:#a7abb3;--line:rgba(255,255,255,.12);
  --gold:#e2b75e;--gold2:#f4d58d;--ok:#7fd6a4;--okbg:rgba(127,214,164,.12);--bad:#f28b82;--badbg:rgba(242,139,130,.12);--warn:#f0b36b;--warnbg:rgba(240,179,107,.12);
  --sh:0 18px 50px rgba(0,0,0,.45);--r:18px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ea;--bg2:#ebe6da;--card:rgba(255,255,255,.8);--card2:#fff;--ink:#16181d;--mute:#5c6169;--line:rgba(20,20,30,.12);
  --gold:#9a6f1c;--gold2:#b8892c;--ok:#1d7a4a;--okbg:#e5f4ec;--bad:#b3261e;--badbg:#fbe9e7;--warn:#9a5413;--warnbg:#fbefe1;--sh:0 14px 34px rgba(60,50,20,.12)}}
:root[data-theme="light"]{--bg:#f4f1ea;--bg2:#ebe6da;--card:rgba(255,255,255,.8);--card2:#fff;--ink:#16181d;--mute:#5c6169;--line:rgba(20,20,30,.12);
  --gold:#9a6f1c;--gold2:#b8892c;--ok:#1d7a4a;--okbg:#e5f4ec;--bad:#b3261e;--badbg:#fbe9e7;--warn:#9a5413;--warnbg:#fbefe1;--sh:0 14px 34px rgba(60,50,20,.12)}
:root{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light}}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Sora,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
select option{background:var(--bg);color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px clamp(14px,4vw,40px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:var(--bg)}
.marca{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;min-width:0}
.marca img{width:26px;height:26px}.marca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acoes{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 10px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1408}
.ic{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:14px;line-height:1}
.seg button:focus-visible,.ic:focus-visible,.bt:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:0 clamp(14px,4vw,40px) 40px}
section{padding:34px 0 6px}
h1{font-size:clamp(30px,5.4vw,52px);line-height:1.08;margin:8px 0 10px}
h2{font-size:clamp(22px,3.4vw,30px);line-height:1.15;margin:0 0 12px}
h3{font-size:17px;margin:0 0 6px}
.kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--mute);max-width:660px;margin:0 0 18px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.nums{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.num{flex:1 1 120px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.num b{display:block;font-size:26px;font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1}
.num span{font-size:12.5px;color:var(--mute)}
.ufs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.uf{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;background:var(--card2)}
.uf b{color:var(--gold)}
.lei{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lei li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.lei .dt{font-weight:700;font-size:13px;white-space:nowrap}
.lei .nm{min-width:0}.lei .nm b{display:block;overflow-wrap:anywhere}.lei .nm small{color:var(--mute);font-size:12.5px}
.lei a{font-size:13px;font-weight:600;color:var(--gold);white-space:nowrap}
.lei .sl{font-size:12px;color:var(--mute);white-space:nowrap}
@media (max-width:480px){.lei li{grid-template-columns:minmax(0,1fr) auto}.lei .dt{grid-column:1/-1}}
.trava{position:relative;margin-top:8px}
.trava .fake{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.trava .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:10px}
.trava .msg b{font-size:16px}
.bt{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:15px;text-align:center}
.bt:hover{border-color:var(--gold)}.bt.pri{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.bt.lg{width:100%}
.bt[disabled]{opacity:.6;cursor:wait}
form .passo{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:18px;height:18px;flex:0 0 auto;margin:2px 0 0;accent-color:var(--gold)}
.tel{display:grid;grid-template-columns:minmax(0,112px) minmax(0,1fr);gap:8px}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.op{flex-direction:row;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);font-size:14px;cursor:pointer}
.op:has(input:checked){border-color:var(--gold)}
.chk{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:13.5px;line-height:1.45}
.chk small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-size:13px;color:var(--mute);margin-bottom:6px;padding:0}
.passos{display:flex;gap:6px;margin-bottom:10px}.passos i{flex:1;height:4px;border-radius:99px;background:var(--card2)}.passos i.on{background:var(--gold)}
.erro{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.nota{color:var(--mute);font-size:12.5px}
.lin{display:flex;gap:8px}.lin .bt{flex:1}
.ok-box{border-color:var(--ok);background:linear-gradient(180deg,var(--okbg),var(--card) 60%)}
.aviso-box{border-color:var(--warn);background:linear-gradient(180deg,var(--warnbg),var(--card) 60%)}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grade3,.grade2{grid-template-columns:minmax(0,1fr)}}
.card p{margin:0;color:var(--mute);font-size:14px}
.comp{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.comp div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:13.5px}
.comp b{display:block}.comp small{color:var(--mute)}
.comp .pg{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin-top:6px;font-size:12.5px;font-variant-numeric:tabular-nums}.comp .pg span:nth-child(even){text-align:right}.comp .pg b{display:inline}
.sim li,.nao li{margin:6px 0}.sim,.nao{padding-left:20px;margin:6px 0 0;font-size:14px}
.sim li::marker{content:"✓  ";color:var(--ok)}.nao li::marker{content:"✕  ";color:var(--bad)}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--gold);font-weight:700}
details[open] summary::after{content:"–"}
details p{margin:8px 0 0;color:var(--mute);font-size:14px}
.full .grupo{margin-top:6px}
.full .grupo summary{font-size:15px}
.filtro{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:6px 0 10px}.filtro label{flex:1 1 180px}
footer{border-top:1px solid var(--line);margin-top:34px;padding:22px clamp(14px,4vw,40px) 40px;color:var(--mute);font-size:12.5px}
footer .disc{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
footer b{color:var(--ink)}
.carrega{color:var(--mute);font-size:14px;padding:12px 0}
</style>
</head>

}

      if (pg) { sl += pg[0]; st += pg[1]; n++; }
      return `<div><b>${esc(c.ci || c.co)}, ${esc(c.uf)}</b><small>${esc(c.co)} County · ${esc(String(c.d || "").slice(0, 4))} · ${esc(c.tp || "")}</small><br><small>${esc(T(c.st === "vendido" ? "vendido" : "comprado"))}</small>`
        + (pg ? `<div class="pg"><span>${esc(T("compLance"))}</span><span>${us(pg[0])}</span><span>${esc(T("compTaxas"))}</span><span>${us(pg[1] - pg[0])}</span><span><b>${esc(T("compTotal"))}</b></span><span><b>${us(pg[1])}</b></span></div>` : "") + `</div>`; }).join("")
      : `<p>${esc(T("semComp"))}</p>`;
    $("#compSoma").textContent = n ? T("compSoma", {n, t: us(st), l: us(sl), x: us(st - sl)}) : "";
  }
  desenhaLista();
}

function desenhaLista(){
  $("#lista").hidden = !LIBERADO;
  if (!LIBERADO || !DADOS) return;
  const f = $("#filUf").value || "";
  const por = {}; LEI.forEach(x => { if (!f || x.uf === f) (por[x.uf] = por[x.uf] || []).push(x); });
  $("#full").innerHTML = Object.entries(por).sort((a, b) => b[1].length - a[1].length).map(([u, xs], i) =>
    `<details class="grupo"${i === 0 || f ? " open" : ""}><summary>${esc(nomeUf(u))} · ${esc(T("nLei", {n: nf(xs.length)}))}</summary><ul class="lei" style="margin-top:10px">`
    + xs.map(x => linha(x, true).replace("</small>", (x.g === "depende" ? " · " + esc(T("gravSobre")) : "") + "</small>")).join("") + `</ul></details>`).join("");
}

function montaSelects(){
  const ddi = $("#ddi"), v = ddi.value;
  ddi.innerHTML = DDI.map(([c, p]) => `<option value="${c}">${p} ${c}</option>`).join("");
  ddi.value = v || ((navigator.language || "").toLowerCase().startsWith("pt-br") ? "+55" : "+1");
  const cap = $("#selCap"), vc = cap.value;
  cap.innerHTML = `<option value="">${esc(T("escolha"))}</option>` + ["cap0","cap1","cap2","cap3","cap4"].map(k => `<option value="${k}">${esc(T(k))}</option>`).join("");
  cap.value = vc;
  const su = $("#selUf"), vu = su.value, lista = Object.keys(UF_EN).sort((a, b) => nomeUf(a).localeCompare(nomeUf(b)));
  su.innerHTML = `<option value="">${esc(T("qualquer"))}</option>` + lista.map(u => `<option value="${u}">${esc(nomeUf(u))}</option>`).join(""); su.value = vu;
  const fu = $("#filUf"), vf = fu.value, comLei = [...new Set(LEI.map(x => x.uf))].sort((a, b) => nomeUf(a).localeCompare(nomeUf(b)));
  fu.innerHTML = `<option value="">${esc(T("todos"))}</option>` + comLei.map(u => `<option value="${u}">${esc(nomeUf(u))}</option>`).join(""); fu.value = vf;
}

/* ---------- formulário ---------- */
const F = $("#fLead");
const telDig = () => (F.tel.value || "").replace(/\D/g, "");
function passo1Ok(){
  const e = $("#erro1");
  if (F.nome.value.trim().length < 2) { e.textContent = T("e_nome"); F.nome.focus(); return false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(F.email.value.trim())) { e.textContent = T("e_email"); F.email.focus(); return false; }
  if (telDig().length < 6 || telDig().length > 15) { e.textContent = T("e_tel"); F.tel.focus(); return false; }
  e.textContent = ""; return true;
}
function vaiPasso(n){ $("#passo1").hidden = n !== 1; $("#passo2").hidden = n !== 2; $("#p2i").classList.toggle("on", n === 2);
  (n === 1 ? F.nome : F.querySelector("input[name=objetivo]")).focus(); }
$("#btProx").addEventListener("click", () => { if (passo1Ok()) vaiPasso(2); });
$("#btVolta").addEventListener("click", () => vaiPasso(1));
F.addEventListener("keydown", ev => { if (ev.key === "Enter" && !$("#passo1").hidden && ev.target.tagName === "INPUT") { ev.preventDefault(); if (passo1Ok()) vaiPasso(2); } });
$("#filUf").addEventListener("change", desenhaLista);

function textoLead(p){
  return [`Lead da página /semana (${p.idioma})`, `Nome: ${p.nome}`, `E-mail: ${p.email}`, `Telefone: ${p.telefone}`,
    `Objetivo: ${p.objetivo}`, `Capital: ${p.capital_txt}`, `Estado de interesse: ${p.estado || "qualquer"}`,
    `Aceite e-mail: ${p.aceite_email ? "sim" : "não"} · Aceite SMS/WhatsApp: ${p.aceite_sms ? "sim" : "não"}`,
    [p.utm_source, p.utm_medium, p.utm_campaign].some(Boolean) ? `Origem: ${[p.utm_source, p.utm_medium, p.utm_campaign].filter(Boolean).join(" / ")}` : ""].filter(Boolean).join("\n");
}
/* ENVIO DO LEAD — isolado aqui. Usa o mesmo endpoint e formato que o site já usa para visitante sem login:
   POST https://api.blrdevelopment.com/api/interesse (Clauds, 01/11: grava no D1, aparece no /admin e avisa a BLR por e-mail),
   JSON com tipo/nome/email/whats/texto/origem/em, como envia() da Vitrine. Não usa /api/cadastro: esse cria acesso de teste de
   7 dias (exige aceite dos termos da Vitrine), não é um lead. Campos novos (objetivo, capital, estado, aceites, utm_*, pagina)
   vão no mesmo objeto e também dentro de "texto", que é o que o e-mail de aviso mostra caso o servidor ignore campo desconhecido. */
async function enviaLead(p){
  const r = await fetch(API + "/api/interesse", {method: "POST", credentials: "include", headers: {"Content-Type": "application/json"}, body: JSON.stringify(p)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.mensagem || "falha"), {st: r.status, erro: j.erro});
  return j;
}

F.addEventListener("submit", async ev => {
  ev.preventDefault();
  const e = $("#erro2");
  if (!passo1Ok()) { vaiPasso(1); return; }
  const obj = F.querySelector("input[name=objetivo]:checked");
  if (!obj) { e.textContent = T("e_obj"); return; }
  if (!F.capital.value) { e.textContent = T("e_cap"); F.capital.focus(); return; }
  if (!F.aceite_email.checked) { e.textContent = T("e_aceite"); F.aceite_email.focus(); return; }
  e.textContent = "";
  const tel = F.ddi.value + " " + telDig();
  const o = origemAcesso() || {};
  const p = {tipo: "lead · semana", pagina: "semana", nome: F.nome.value.trim().slice(0, 120), email: F.email.value.trim().slice(0, 160),
    telefone: tel, whats: F.aceite_sms.checked ? tel : "", objetivo: obj.value, capital: F.capital.value, capital_txt: I.en[F.capital.value],
    estado: F.estado.value, aceite_email: true, aceite_sms: !!F.aceite_sms.checked, aceite_termos: true, idioma: LANG,
    utm_source: UTM.utm_source || o.utm_source || "", utm_medium: UTM.utm_medium || o.utm_medium || "", utm_campaign: UTM.utm_campaign || o.utm_campaign || "",
    origem: Object.keys(o).length ? o : (Object.keys(UTM).length ? UTM : null), url: location.href.slice(0, 300), em: new Date().toISOString()};
  p.texto = textoLead(p);
  const bt = $("#btEnvia"); bt.disabled = true; bt.textContent = T("enviando");
  let gravou = false;
  try { await enviaLead(p); gravou = true; } catch (err) { console.warn("lead:", err.st, err.erro || err.message); }
  bt.disabled = false; bt.textContent = T("fEnvia");
  guarda("blr_semana_lead", {em: p.em, gravou});
  guarda("vitrine_cadastro", {nome: p.nome, email: p.email, whats: p.whats});   // a Vitrine já preenche os formulários com isto
  libera(p, gravou);
});

function libera(p, gravou){
  LIBERADO = true;
  F.hidden = true; $("#pronto").hidden = false;
  $("#okTxt").textContent = p ? T("okTxt", {nome: p.nome.split(" ")[0], email: p.email}) : "";
  const wa = CONTATO.whats.replace(/\D/g, "");
  $("#btCall").href = `https://wa.me/${wa}?text=${encodeURIComponent(T("callMsg"))}`;
  $("#callAlt").innerHTML = esc(T("callAlt", {email: "\u0000"})).replace("\u0000", `<a href="mailto:${esc(CONTATO.email)}?subject=${encodeURIComponent(T("call"))}">${esc(CONTATO.email)}</a>`);
  $("#falhou").hidden = gravou !== false;
  if (p && gravou === false) {
    $("#waFalha").href = `https://wa.me/${wa}?text=${encodeURIComponent(p.texto)}`;
    $("#mailFalha").href = `mailto:${CONTATO.email}?subject=${encodeURIComponent("Lead /semana")}&body=${encodeURIComponent(p.texto)}`;
  }
  montaSelects(); desenha();
}

/* ---------- início ---------- */
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  aplicaLang(b.dataset.lang);
  if (LIBERADO) { const s = JSON.parse(le("vitrine_cadastro") || "{}"); $("#okTxt").textContent = s.email ? T("okTxt", {nome: String(s.nome || "").split(" ")[0], email: s.email}) : ""; }
}));
checaI18n();
{ const q = new URLSearchParams(location.search).get("lang"); aplicaLang(q || le("blr_semana_lang") || "en"); }
if (le("blr_semana_lead")) { const s = (() => { try { return JSON.parse(le("vitrine_cadastro") || "{}"); } catch (e) { return {}; } })();
  libera(s.email ? {nome: s.nome || "", email: s.email} : null, null); }
carrega();
</script>
