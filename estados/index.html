let LANG = "en";
function checaI18n(){
  const falta = [];
  for (const a of ["en", "pt"]) for (const b of ["en", "pt"]) if (a !== b) for (const k in I[a]) if (!(k in I[b])) falta.push(b + "." + k);
  document.querySelectorAll("[data-i],[data-ih],[data-ip],[data-it],[data-ia]").forEach(e => {
    const k = e.dataset.i || e.dataset.ih || e.dataset.ip || e.dataset.it || e.dataset.ia;
    for (const l of ["en", "pt"]) if (!(k in I[l])) falta.push(l + "." + k);
  });
  window.__i18nFaltando = [...new Set(falta)];
  if (window.__i18nFaltando.length) console.warn("i18n: chave faltando:", window.__i18nFaltando.join(", "));
}
const T = (k, v) => { let s = (I[LANG] && I[LANG][k]);
  if (s == null) { console.warn("i18n: chave faltando:", LANG + "." + k); (window.__i18nFaltando = window.__i18nFaltando || []).push(LANG + "." + k); s = I.en[k] != null ? I.en[k] : k; }
  return v ? s.replace(/\{(\w+)\}/g, (_, x) => v[x] != null ? v[x] : "") : s; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = n => Number(n || 0).toLocaleString(LANG === "pt" ? "pt-BR" : "en-US");
const guarda = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const le = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const linkOk = u => /^https:\/\//i.test(u || "") ? u : "";
const AC = "a confirmar";
const TIPOS = ["deed", "lien", "redeemable", "hibrido", "nd"];

/* ---------- dados ---------- */
let REG = {}, ORDEM = [], COB = null, COB_ERRO = false, SEL = null, FILTRO = null, ORD = "nome";
const tipoDe = uf => { const t = (REG[uf] || {}).tipo; return TIPOS.includes(t) && t !== "nd" ? t : "nd"; };
const nome = uf => { const n = (REG[uf] || {}).nome || {}; return n[LANG] || n.en || uf; };
const vazio = v => v == null || v === "" || v === AC;
/* valor de campo: {en,pt} | "sim"/"nao"/"varia" | "a confirmar" → HTML seguro */
function val(v){
  if (vazio(v)) return `<span class="ac">${esc(T("aConf"))}</span>`;
  if (typeof v === "string") return esc(["sim", "nao", "varia"].includes(v) ? T(v) : v);
  return esc(v[LANG] || v.en || "");
}
const txtPuro = v => vazio(v) ? T("aConf") : typeof v === "string" ? (["sim", "nao", "varia"].includes(v) ? T(v) : v) : (v[LANG] || v.en || "");
function vitrineHref(){ return "/?lang=" + LANG + "#explorar"; }   // a Vitrine não filtra por UF na URL

/* ---------- legenda (também é filtro) ---------- */
function montaLegenda(){
  const cont = {}; ORDEM.forEach(uf => { const t = tipoDe(uf); cont[t] = (cont[t] || 0) + 1; });
  $("#leg").setAttribute("aria-label", T("legAria"));
  $("#leg").innerHTML = TIPOS.filter(t => cont[t]).map(t =>
    `<button type="button" data-t="${t}" aria-pressed="${FILTRO === t}"><i style="background:var(--t-${t})"></i>${esc(T("t_" + t))} <small>${cont[t]}</small></button>`).join("");
  $("#leg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { FILTRO = FILTRO === b.dataset.t ? null : b.dataset.t; montaLegenda(); pintaMapa(); montaTabela(); }));
}

/* ---------- mapa (d3-geo + topojson do próprio site: atual.json → EUA, objects.states) ---------- */
let MAPA_OK = false;
async function montaMapa(eua){
  const svg = d3.select("#svg"); svg.selectAll("*").remove();
  const ok = new Set(ORDEM.map(uf => REG[uf].fips));
  const fc = topojson.feature(eua, eua.objects.states);
  fc.features = fc.features.filter(f => ok.has(String(f.id).padStart(2, "0")));
  const proj = d3.geoAlbersUsa().fitExtent([[8, 8], [967, 602]], fc), path = d3.geoPath(proj);
  const porFips = {}; ORDEM.forEach(uf => porFips[REG[uf].fips] = uf);
  const g = svg.append("g");
  for (const f of fc.features) {
    const uf = porFips[String(f.id).padStart(2, "0")]; if (!uf) continue;
    const d = path(f); if (!d) continue;
    if (uf === "DC") {   // DC some no mapa: um círculo clicável no lugar
      const c = path.centroid(f);
      g.append("circle").attr("class", "uf").attr("data-uf", uf).attr("cx", c[0]).attr("cy", c[1]).attr("r", 7);
      g.append("text").attr("x", c[0] + 10).attr("y", c[1] + 3).text("DC");
    } else g.append("path").attr("class", "uf").attr("data-uf", uf).attr("d", d);
  }
  g.selectAll(".uf").attr("tabindex", 0).attr("role", "button")
    .on("click", (ev) => abre(ev.currentTarget.dataset.uf, true))
    .on("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abre(ev.currentTarget.dataset.uf, true); } })
    .append("title");
  MAPA_OK = true; pintaMapa();
}
function pintaMapa(){
  if (!MAPA_OK) return;
  d3.selectAll("#svg .uf").each(function(){
    const uf = this.dataset.uf, t = tipoDe(uf);
    this.style.fill = `var(--t-${t})`;
    this.classList.toggle("sel", uf === SEL);
    this.classList.toggle("apaga", !!FILTRO && FILTRO !== t);
    this.setAttribute("aria-label", nome(uf) + ": " + T("t_" + t));
    const tt = this.querySelector("title"); if (tt) tt.textContent = nome(uf) + " — " + T("t_" + t);
  });
}

/* ---------- painel ---------- */
function vitrineBox(uf){
  if (COB_ERRO) return `<div class="vit"><p class="nota" style="margin:0">${esc(T("vitErro"))}</p></div>`;
  if (!COB) return "";
  const c = COB[uf];
  if (!c || !c.n) return `<div class="vit"><b>${esc(T("vitT"))}</b><p class="nota" style="margin:4px 0 8px">${esc(T("vitZero"))}</p>
    <a class="bt pri lg" href="/?teste=1">${esc(T("verTeste"))}</a></div>`;
  return `<div class="vit"><b>${esc(T("vitT"))}</b><p style="margin:4px 0 8px"><b class="n">${esc(T("vitN", {n: nf(c.n), l: nf(c.lei), c: nf(c.co)}))}</b></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="bt" style="flex:1" href="${esc(vitrineHref(uf))}">${esc(T("vitLink"))}</a>
    <a class="bt pri" style="flex:1" href="/?teste=1">${esc(T("verTeste"))}</a></div></div>`;
}
function abre(uf, rolar){
  if (!REG[uf]) return;
  SEL = uf; const r = REG[uf], t = tipoDe(uf);
  const lei = r.lei || {}, leiUrl = linkOk(lei.url);
  const fontes = (r.fontes || []).filter(f => linkOk(f.url));
  const vistos = new Set(), lis = [];
  for (const f of fontes) { if (vistos.has(f.url)) continue; vistos.add(f.url);
    let host = ""; try { host = new URL(f.url).hostname.replace(/^www\./, ""); } catch (e) {}
    lis.push(`<li><a class="fonte" href="${esc(f.url)}" target="_blank" rel="noopener nofollow">${esc(host)}</a>${f.cit ? " · " + esc(f.cit) : ""}</li>`); }
  if (leiUrl && !vistos.has(leiUrl)) lis.unshift(`<li><a class="fonte" href="${esc(leiUrl)}" target="_blank" rel="noopener nofollow">${esc(lei.cit || leiUrl)}</a></li>`);
  const tn = r.tipo_nota && !vazio(r.tipo_nota) ? `<p class="nota" style="margin:8px 0 0">${val(r.tipo_nota)}</p>` : "";
  $("#painel").innerHTML = `<span class="kick">${esc(T("kPainel"))}</span>
    <h2 class="serif">${esc(nome(uf))}</h2>
    <span class="tp" style="background:var(--t-${t})">${esc(T("t_" + t))}</span>${tn}
    <dl>
      <dt>${esc(T("fJuros"))}</dt><dd>${val(r.juros)}</dd>
      <dt>${esc(T("fResg"))}</dt><dd>${val(r.resgate)}</dd>
      <dt>${esc(T("fOnline"))}</dt><dd>${val(r.online)}</dd>
      <dt>${esc(T("fOtc"))}</dt><dd>${val(r.otc)}</dd>
      <dt>${esc(T("fQuando"))}</dt><dd>${val(r.quando)}</dd>
      <dt>${esc(T("fLei"))}</dt><dd>${leiUrl ? `<a href="${esc(leiUrl)}" target="_blank" rel="noopener nofollow">${esc(lei.cit || leiUrl)}</a>` : (lei.cit && lei.cit !== AC ? esc(lei.cit) + " · " : "") + `<span class="ac">${esc(T("aConf"))}</span>`}</dd>
      <dt>${esc(T("fConf"))}</dt><dd>${esc(dataFmt(r.conferido))}</dd>
    </dl>
    ${r.condado ? `<p class="nota ac-cond">${esc(T("condado", {c: r.condado}))}</p>` : ""}
    ${vitrineBox(uf)}
    <b style="font-size:13px">${esc(T("fFontes"))}</b>
    ${lis.length ? `<ul class="fontes">${lis.join("")}</ul>` : `<p class="nota">${esc(T("semFonte"))}</p>`}`;
  $("#selUf").value = uf;
  pintaMapa();
  if (location.hash !== "#" + uf) history.replaceState(null, "", "#" + uf);
  if (rolar && matchMedia("(max-width:900px)").matches) $("#painel").scrollIntoView({behavior: "smooth", block: "start"});
}
function painelVazio(){
  $("#painel").innerHTML = `<span class="kick">${esc(T("kPainel"))}</span><h2 class="serif">${esc(T("pVazioT"))}</h2><p class="nota">${esc(T("pVazio"))}</p>`;
}
function dataFmt(s){ if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return T("aConf"); const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LANG === "pt" ? "pt-BR" : "en-US", {year: "numeric", month: "short", day: "numeric"}); }

/* ---------- seletor e tabela ---------- */
function montaSelect(){
  const s = $("#selUf"), atual = SEL || "";
  s.innerHTML = `<option value="">${esc(T("escolhaOp"))}</option>` + [...ORDEM].sort((a, b) => nome(a).localeCompare(nome(b), LANG)).map(uf => `<option value="${uf}">${esc(nome(uf))}</option>`).join("");
  s.value = atual;
}
const ordTipo = {deed: 0, redeemable: 1, hibrido: 2, lien: 3, nd: 4}, ordSim = {sim: 0, varia: 1, nao: 2};
function montaTabela(){
  const q = ($("#busca").value || "").trim().toLowerCase();
  let ufs = ORDEM.filter(uf => !FILTRO || tipoDe(uf) === FILTRO);
  if (q) ufs = ufs.filter(uf => { const r = REG[uf];
    return [uf, nome(uf), T("t_" + tipoDe(uf)), txtPuro(r.juros), txtPuro(r.resgate), txtPuro(r.quando), r.online === "sim" ? "online" : "", (r.lei || {}).cit].join(" ").toLowerCase().includes(q); });
  const lotes = uf => (COB && COB[uf] && COB[uf].n) || 0;
  const k = {nome: uf => nome(uf), tipo: uf => ordTipo[tipoDe(uf)] + nome(uf), online: uf => (ordSim[REG[uf].online] ?? 3) + nome(uf),
    otc: uf => (ordSim[REG[uf].otc] ?? 3) + nome(uf), lotes: uf => String(1e7 - lotes(uf)).padStart(8, "0") + nome(uf)}[ORD];
  ufs.sort((a, b) => k(a).localeCompare(k(b), LANG));
  const R = c => ` data-r="${esc(T(c))}"`;
  $("#tb").innerHTML = ufs.length ? ufs.map(uf => { const r = REG[uf], t = tipoDe(uf), lei = r.lei || {}, u = linkOk(lei.url), c = COB && COB[uf];
    return `<tr data-uf="${uf}">
      <td class="uf"><b>${esc(nome(uf))}</b><small>${uf}</small></td>
      <td${R("cTipo")}><span class="pill"><i style="background:var(--t-${t})"></i>${esc(T("t_" + t))}</span></td>
      <td${R("cJuros")}>${val(r.juros)}</td><td${R("cResg")}>${val(r.resgate)}</td>
      <td${R("cOnline")}>${val(r.online)}</td><td${R("cOtc")}>${val(r.otc)}</td><td${R("cQuando")}>${val(r.quando)}</td>
      <td${R("cLei")}>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener nofollow">${esc(lei.cit || "link")}</a>` : `<span class="ac">${esc(T("aConf"))}</span>`}</td>
      <td${R("cVit")}>${c && c.n ? `<a href="${esc(vitrineHref(uf))}">${esc(T("vitCurto", {n: nf(c.n), l: nf(c.lei)}))}</a>` : "–"}</td></tr>`; }).join("")
    : `<tr><td colspan="9">${esc(T("nenhum"))}</td></tr>`;
  $("#tb").querySelectorAll("tr[data-uf]").forEach(tr => tr.addEventListener("click", ev => {
    if (ev.target.closest("a")) return; abre(tr.dataset.uf, false); $("#mapa").scrollIntoView({behavior: "smooth", block: "start"}); }));
  const datas = ORDEM.map(uf => REG[uf].conferido).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d || "")).sort();
  const tx = datas.length ? T("conferido", {a: dataFmt(datas[0]), b: dataFmt(datas[datas.length - 1])}) : "";
  $("#conferidoTab").textContent = tx; $("#conferidoRod").textContent = tx;
}

/* ---------- idioma e tema ---------- */
function aplicaLang(l){
  LANG = l === "pt" ? "pt" : "en"; guarda("blr_lang", LANG);
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = T(e.dataset.i); });
  document.querySelectorAll("[data-ih]").forEach(e => { e.innerHTML = T(e.dataset.ih); });   // só texto do próprio dicionário
  document.querySelectorAll("[data-ip]").forEach(e => { e.placeholder = T(e.dataset.ip); });
  document.querySelectorAll("[data-it]").forEach(e => { e.title = T(e.dataset.it); e.setAttribute("aria-label", T(e.dataset.it)); });
  document.querySelectorAll("[data-ia]").forEach(e => { e.setAttribute("aria-label", T(e.dataset.ia)); });
  $("#btExplorar").href = vitrineHref("");
  if (ORDEM.length) { montaLegenda(); montaSelect(); montaTabela(); pintaMapa(); if (SEL) abre(SEL, false); else painelVazio(); }
}
(function(){ const t = le("blr_semana_tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
$("#btTema").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const novo = atual === "light" ? "dark" : "light"; document.documentElement.setAttribute("data-theme", novo); guarda("blr_semana_tema", novo);
});
function langInicial(){
  const q = new URLSearchParams(location.search).get("lang"); if (q === "pt" || q === "en") return q;
  const s = le("blr_lang") || le("blr_semana_lang"); if (s === "pt" || s === "en") return s;
  return /^pt/i.test(navigator.language || "") ? "pt" : "en";
}

/* ---------- início ---------- */
async function inicia(){
  const q = u => fetch(u, {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(u + " " + r.status); return r.json(); });
  try {
    const e = await q("/estados/estados.json");
    REG = e.estados || {}; ORDEM = Object.keys(REG);
  } catch (err) { console.warn("estados:", err.message); $("#carrega").textContent = T("erroDados"); return; }
  aplicaLang(LANG);
  let a = null;
  try { a = await q("/atual.json"); } catch (err) { console.warn("atual:", err.message); }
  const pDados = a && a.DADOS ? q("/" + String(a.DADOS).replace(/^\/+/, "")).then(d => { COB = (d.cobertura || {}).uf || {}; }).catch(err => { COB_ERRO = true; console.warn("dados:", err.message); })
                             : Promise.resolve().then(() => { COB_ERRO = true; });
  const pMapa = a && a.EUA && window.d3 && window.topojson ? q("/" + String(a.EUA).replace(/^\/+/, "")).then(montaMapa).then(() => $("#carrega").hidden = true)
                             : Promise.reject(new Error("mapa indisponível"));
  pMapa.catch(err => { console.warn("mapa:", err.message); $("#carrega").textContent = T("erroDados"); });
  await pDados; montaTabela(); if (SEL) abre(SEL, false);
  await pMapa.catch(() => {});
  const h = location.hash.slice(1).toUpperCase(); if (REG[h]) abre(h, false);
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => aplicaLang(b.dataset.lang)));
$("#selUf").addEventListener("change", ev => { if (ev.target.value) abre(ev.target.value, true); });
$("#busca").addEventListener("input", montaTabela);
document.querySelectorAll("th button[data-ord]").forEach(b => b.addEventListener("click", () => { ORD = b.dataset.ord; montaTabela(); }));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1).toUpperCase(); if (REG[h] && h !== SEL) abre(h, false); });
checaI18n();
LANG = langInicial(); aplicaLang(LANG);
inicia();
</script>
