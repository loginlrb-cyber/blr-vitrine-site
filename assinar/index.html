<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Assinar · BLR</title>
<link rel="icon" type="image/svg+xml" href="/blr-icon-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assinar/assinar.css">
<script>try{ const t = localStorage.getItem("blr_novo_tema"); if(t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  else if(matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; }catch(e){}</script>
<script src="/assinar/planos.js"></script>
<script src="https://js.stripe.com/v3/" async id="stripeJs"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marca" href="/" aria-label="BLR Developments, início"><i><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 6l11-2 3 13-12 3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></i>BLR <small>Assinatura</small></a>
  <a class="voltar" href="/#planos">← Voltar aos planos</a>
</div></header>
<main class="wrap grade">
  <section class="cartao resumo" id="resumo" aria-live="polite"></section>
  <section class="cartao"><div id="checkout"><div class="estado"><div class="gira" aria-hidden="true"></div><p>Abrindo o pagamento seguro…</p></div></div></section>
</main>
<script>
"use strict";
/* Checkout embutido (13/11/2026). Rotas no servidor da Gallery (API-SERVIDOR.md §3):
   POST /api/checkout {plano, ciclo} → {client_secret} · 401 login · 409 já assina (troca_de_plano traz plano_atual; ja_assinante traz plano) · sem teste grátis no Stripe · 502/503 → payment link de sempre.
   O Stripe volta para /assinar/ok/?session_id=...; quem libera o plano é o webhook. */
const P = window.BLR_PLANOS, API = P.api, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const USD = new Intl.NumberFormat("pt-BR", {style: "currency", currency: "USD"});
const q = new URLSearchParams(location.search);
let plano = ["basico", "pro", "ultra"].includes(q.get("plano")) ? q.get("plano") : "pro";
let ciclo = q.get("ciclo") === "anual" ? "anual" : "mensal";
let EU = null, CO = null, vez = 0;
const pl = () => P.planos.find(p => p.id === plano);
const linkPag = () => P.stripe[plano][ciclo === "anual" ? "a" : "m"] + (EU && EU.email ? "?prefilled_email=" + encodeURIComponent(EU.email) : "");

function resumo(){
  const p = pl(), v = ciclo === "anual" ? p.a : p.m;
  $("#resumo").innerHTML = `<h1>Plano ${esc(p.nome)}</h1><div class="quem">${esc(p.quem)}</div>
    <div class="preco num">${USD.format(v).replace(/,00$/, "")}<small> /${ciclo === "anual" ? "ano" : "mês"}</small></div>
    <div class="ciclo" role="group" aria-label="Forma de pagamento"><button type="button" data-c="mensal" aria-pressed="${ciclo === "mensal"}">Mensal</button><button type="button" data-c="anual" aria-pressed="${ciclo === "anual"}">Anual · 2 meses grátis</button></div>
    <ul>${p.itens.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <div class="trocar" aria-label="Trocar de plano">${P.planos.filter(x => x.m).map(x => `<a href="?plano=${x.id}&ciclo=${ciclo}" data-p="${x.id}" aria-current="${x.id === plano}">${esc(x.nome)}</a>`).join("")}</div>
    <p class="nota">A cobrança é feita na hora, quando você confirma no formulário do Stripe, e o acesso é liberado logo em seguida. Pagamento em nome de BLR Development. Mensal: cancele quando quiser.${p.selo ? " O teste grátis de 7 dias é outro caminho: pelo cadastro do site, sem cartão." : ""}</p>
    ${EU && EU.email ? `<p class="nota">Conta: <b>${esc(EU.email)}</b></p>` : ""}`;
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { if(ciclo === b.dataset.c) return; ciclo = b.dataset.c; troca(); });
  document.querySelectorAll("[data-p]").forEach(a => a.onclick = e => { e.preventDefault(); if(plano === a.dataset.p) return; plano = a.dataset.p; troca(); });
}
function troca(){ history.replaceState(null, "", `?plano=${plano}&ciclo=${ciclo}`); resumo(); monta(); }
function tela(html, erro){ $("#checkout").innerHTML = `<div class="estado${erro ? " erro" : ""}">${html}</div>`; }
const carregando = () => tela(`<div class="gira" aria-hidden="true"></div><p>Abrindo o pagamento seguro…</p>`);
function planoB(motivo){
  tela(`<h2>O pagamento dentro do site não abriu agora</h2><p>${esc(motivo)} Você pode pagar pela página do Stripe, com o mesmo preço.</p>
    <div class="acoes"><a class="btn pri" href="${esc(linkPag())}">Pagar pelo Stripe</a><button class="btn" type="button" id="deNovo">Tentar de novo</button></div>`, true);
  $("#deNovo").onclick = monta;
}
const esperaStripe = () => new Promise((ok, falha) => { if(window.Stripe) return ok(); const s = $("#stripeJs");
  s.addEventListener("load", () => ok()); s.addEventListener("error", () => falha(new Error("stripe.js"))); setTimeout(() => window.Stripe ? ok() : falha(new Error("stripe.js demorou")), 15000); });

async function monta(){
  const minha = ++vez;
  if(CO){ try{ CO.destroy(); }catch(e){} CO = null; }
  carregando();
  let r, j = {};
  try{ r = await fetch(API + "/api/checkout", {method: "POST", credentials: "include", headers: {"Content-Type": "application/json", "X-CSRF": EU.csrf || ""}, body: JSON.stringify({plano, ciclo})});
    j = await r.json().catch(() => ({})); }
  catch(e){ if(minha === vez) planoB("O servidor não respondeu."); return; }
  if(minha !== vez) return;
  if(r.status === 401) return vaiEntrar();
  if(r.status === 409){
    const atual = (P.planos.find(p => p.id === (j.plano_atual || j.plano || EU.plano)) || {}).nome || j.plano_atual || j.plano || EU.plano || "";
    tela(`<h2>Você já tem uma assinatura${atual ? ": " + esc(atual) : ""}</h2><p>${esc(j.mensagem || "Para trocar de plano, fale com a BLR ou ajuste em Minha conta.")}</p>
      <div class="acoes"><a class="btn pri" href="/conta/">Minha conta</a><a class="btn" href="/">Abrir a Vitrine</a></div>`); return; }
  if(!r.ok || !j.client_secret) return planoB(j.mensagem || (r.status === 503 ? "O pagamento embutido está em manutenção." : `Código ${r.status}.`));
  try{ await esperaStripe(); }catch(e){ if(minha === vez) planoB("O formulário do Stripe não carregou neste navegador."); return; }
  if(minha !== vez) return;
  try{ const stripe = window.Stripe(P.pk); const co = await stripe.initEmbeddedCheckout({fetchClientSecret: () => Promise.resolve(j.client_secret)});
    if(minha !== vez){ co.destroy(); return; }
    $("#checkout").innerHTML = ""; co.mount("#checkout"); CO = co; }
  catch(e){ console.warn("checkout:", e); if(minha === vez) planoB("O formulário do Stripe não abriu."); }
}
function vaiEntrar(){ location.replace("/?entrar=1&volta=" + encodeURIComponent(location.pathname + location.search)); }

(async function(){
  resumo();
  try{ const r = await fetch(API + "/api/me", {credentials: "include"}); if(r.status === 401) return vaiEntrar(); EU = await r.json(); }
  catch(e){ EU = {}; return planoB("Não foi possível conferir a sua conta."); }
  if(!EU || !EU.email) return vaiEntrar();
  resumo(); monta();
})();
</script>
</body>
</html>
