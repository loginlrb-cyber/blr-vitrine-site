<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Assinatura · BLR</title>
<link rel="icon" type="image/svg+xml" href="/blr-icon-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assinar/assinar.css">
<script>try{ const t = localStorage.getItem("blr_novo_tema"); if(t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  else if(matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; }catch(e){}</script>
<script src="/assinar/planos.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marca" href="/" aria-label="BLR Developments, início"><i><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 6l11-2 3 13-12 3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></i>BLR <small>Assinatura</small></a>
</div></header>
<main class="wrap"><section class="ok-pag" id="ok" aria-live="polite"><div class="estado"><div class="gira" aria-hidden="true"></div><p>Conferindo o pagamento…</p></div></section></main>
<script>
"use strict";
/* Volta do checkout embutido (13/11/2026). GET /api/checkout/status?session_id → {status, payment_status, plano}.
   Quem libera o plano é o webhook: a página repete o /api/me a cada 2,5 s, por até 30 s, até o plano aparecer. */
const P = window.BLR_PLANOS, API = P.api, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const sid = new URLSearchParams(location.search).get("session_id") || "";
const nomePlano = id => (P.planos.find(p => p.id === id) || {}).nome || id || "";
const OK_ICONE = `<div class="icone"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
const pinta = h => { $("#ok").innerHTML = h; };
const espera = ms => new Promise(r => setTimeout(r, ms));
async function pega(r){ const x = await fetch(API + r, {credentials: "include"}); const j = await x.json().catch(() => ({})); if(!x.ok) throw Object.assign(new Error("falha"), {st: x.status}); return j; }

(async function(){
  if(!/^cs_[A-Za-z0-9_]+$/.test(sid)){ pinta(`<h1>Nada para conferir</h1><p>Esta página abre sozinha depois do pagamento.</p><div class="acoes"><a class="btn pri" href="/#planos">Ver os planos</a></div>`); return; }
  let st = null;
  try{ st = await pega("/api/checkout/status?session_id=" + encodeURIComponent(sid)); }
  catch(e){ st = null; }
  if(st && st.status === "open"){
    pinta(`<h1>O pagamento não foi concluído</h1><p>Nada foi cobrado. Você pode voltar e tentar de novo.</p><div class="acoes"><a class="btn pri" href="/assinar/?plano=${esc(st.plano || "pro")}">Voltar ao pagamento</a><a class="btn" href="/#planos">Ver os planos</a></div>`); return; }
  if(st && st.status === "expired"){
    pinta(`<h1>Este pagamento expirou</h1><p>Nada foi cobrado. Comece de novo pelos planos.</p><div class="acoes"><a class="btn pri" href="/#planos">Ver os planos</a></div>`); return; }
  const plano = st && st.plano, pago = !!(st && st.status === "complete"), teste = !!(pago && st.payment_status === "no_payment_required");
  // só diz "Pagamento recebido" com a confirmação do Stripe; sem ela (sessão de outro navegador, servidor fora), fala neutro
  if(!pago) pinta(`<h1>Conferindo a sua assinatura</h1><p>Não consegui confirmar o pagamento com o Stripe agora. Estou olhando a sua conta…</p><div class="estado" style="min-height:80px"><div class="gira" aria-hidden="true"></div></div>`);
  else pinta(`${OK_ICONE}<h1>${teste ? "Teste grátis iniciado" : "Pagamento recebido"}</h1><p>Liberando o seu plano${plano ? " " + esc(nomePlano(plano)) : ""}… isto leva só alguns segundos.</p><div class="estado" style="min-height:80px"><div class="gira" aria-hidden="true"></div></div>`);
  const t0 = Date.now();
  while(Date.now() - t0 < 30000){
    try{ const eu = await pega("/api/me"); if(eu && eu.plano && (!plano || eu.plano === plano)){
      pinta(`${OK_ICONE}<h1>Pronto! Seu plano ${esc(nomePlano(eu.plano))} está ativo</h1><p>${teste ? "Nada foi cobrado hoje: a primeira cobrança é ao fim do teste, e dá para cancelar antes em Minha conta. " : ""}Teto de lance, ARV, endereço e contorno dos lotes já aparecem para você${Array.isArray(eu.estados) && eu.estados_limite && !eu.estados.length ? ". Antes, escolha os seus estados" : ""}.</p>
        <div class="acoes"><a class="btn pri" href="/">Abrir a Vitrine</a><a class="btn" href="/conta/">Minha conta</a></div>`); return; } }
    catch(e){ if(e.st === 401) break; }
    await espera(2500);
  }
  if(!pago){ pinta(`<h1>Ainda não vimos a confirmação</h1><p>Se você concluiu o pagamento, o plano aparece na sua conta em instantes: abra a Vitrine e atualize em 1 minuto. Se não concluiu, nada foi cobrado. Dúvidas: fale com a BLR pelo assistente.</p>
    <div class="acoes"><a class="btn pri" href="/">Abrir a Vitrine</a><a class="btn" href="/#planos">Ver os planos</a></div>`); return; }
  pinta(`${OK_ICONE}<h1>${teste ? "Teste grátis iniciado" : "Pagamento recebido"}</h1><p>O seu plano está sendo liberado e aparece em instantes. Se não aparecer ao abrir a Vitrine, atualize a página em 1 minuto. Se ainda assim não aparecer, fale com a BLR pelo assistente ou pelo e-mail.</p>
    <div class="acoes"><a class="btn pri" href="/">Abrir a Vitrine</a></div>`);
})();
</script>
</body>
</html>
