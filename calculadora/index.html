"use strict";
/* ---------- parâmetros: MESMOS nomes e valores de vitrine_tpl.html (linhas 1487–1494 e 4936). teste_calculadora.py confere. ---------- */
const CONTA0 = {m: 40, n: "ano", p: {leve: 20, media: 30, geral: 45}, t: true, qt: null};
const QT = {PA: 2000, MI: 2500, NY: 6000, AR: 2250}, QT0 = 5000;
const CJ = .11 * 6 / 12, CSAIDA = .05, CFIXOS = 2550, CTIP = .65;
const CVENDA_T = .80, CMARG_T = -10;
const JVC = {proj: .01, projMin: 6000, lic: .015, licMin: 500, fs: .60, ff: .75, com: .05, mkt: .025, gc: .01, fech: .01, adm: .25, admMin: 1000, admArv: .01, limpeza: 5};
const nivelAno = y => { const a = parseFloat(y); return isNaN(a) ? "geral" : a >= 2000 ? "leve" : a >= 1970 ? "media" : "geral"; };
const UFS = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];

/* modDe da clássica (vitrine_tpl.html ≈ linha 4938), sem o objeto do lote: arv = l.am, area = l.a || l.ae */
function modDe(arv, area, mod, reno, qt, m){
  const ff = mod === "ff", V = arv * JVC[mod];
  const obra = ff ? reno : area * JVC.limpeza, adm = ff ? JVC.adm * obra : Math.max(JVC.admMin, JVC.admArv * arv);
  const proj = ff && obra > 0 ? Math.max(JVC.projMin, JVC.proj * arv) : 0, lic = ff && obra > 0 ? Math.max(JVC.licMin, JVC.lic * obra) : 0;
  const fixos = CFIXOS + qt + lic, cv = V * (JVC.mkt + JVC.gc + JVC.fech), com = V * JVC.com, custos = proj + obra + adm + fixos + cv;
  const mg = m / 100 * V, bmax = V - com - custos - mg;
  return {mod, V, com, proj, obra, adm, qt, lic, fixos, cv, custos, mg, bmax};
}
/* contaDe da clássica (≈ linha 4949) + dois extras opcionais desta página (dívida que sobrevive e taxa do leilão em % do lance).
   Com os dois em zero, teto = contaDe(l).teto. Com eles, o teto é o lance em que o lucro ainda é a margem pedida. */

    for (const l of ["en", "pt"]) if (!(k in I[l])) falta.push(l + "." + k);
  });
  window.__i18nFaltando = [...new Set(falta)];
  if (window.__i18nFaltando.length) console.warn("i18n: chave faltando:", window.__i18nFaltando.join(", "));
}
const T = (k, v) => { let s = I[LANG] && I[LANG][k];
  if (s == null) { console.warn("i18n: chave faltando:", LANG + "." + k); (window.__i18nFaltando = window.__i18nFaltando || []).push(LANG + "." + k); s = I.en[k] != null ? I.en[k] : k; }
  return v ? s.replace(/\{(\w+)\}/g, (_, x) => v[x] != null ? v[x] : "") : s; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const guarda = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const le = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const loc = () => LANG === "pt" ? "pt-BR" : "en-US";
// EN $79,600 · PT US$ 79.600
const din = n => { const r = Math.round(+n || 0), s = Math.abs(r).toLocaleString(loc());
  return (r < 0 ? "−" : "") + (LANG === "pt" ? "US$ " + s : "$" + s); };
const pct = (x, d) => (x < 0 ? "−" : "") + Math.abs(x).toLocaleString(loc(), {maximumFractionDigits: d == null ? 1 : d});   // número de %, sem o símbolo
const nf = n => Math.round(+n).toLocaleString(loc());

/* ---------- formulário ---------- */
const F = $("#f");
let TIPO = "casa";
const num = n => { const e = F.elements[n]; if (!e || e.value.trim() === "") return null; const v = Number(e.value); return isFinite(v) ? v : null; };
function le_form(){
  const pos = n => { const v = num(n); return v != null && v >= 0 ? v : null; };
  return {tipo: TIPO, arv: pos("arv"), area: pos("area"), ano: num("ano"), nivel: F.elements.nivel.value, reforma: pos("reforma"),
    uf: F.elements.uf.value, abertura: pos("abertura"), divida: pos("divida") || 0, premio: Math.min(40, pos("premio") || 0),
    m: pos("m") == null ? CONTA0.m : pos("m"), titulo: F.elements.titulo.checked, qt: pos("qt"),
    p: {leve: pos("pp_leve") ?? CONTA0.p.leve, media: pos("pp_media") ?? CONTA0.p.media, geral: pos("pp_geral") ?? CONTA0.p.geral}};
}
function montaUf(){
  const s = $("#selUf"), atual = s.value || "PA";
  s.innerHTML = UFS.map(u => `<option value="${u}">${u}${QT[u] ? "" : ""}</option>`).join("");
  s.value = atual;
}
function textoPasso(k, c, x){
  const md = c.m, P = v => pct(v * 100);
  switch (k) {
    case "arv": return [T(c.tipo === "terreno" ? "s_arvT" : "s_arv"), ""];
    case "venda_fs": case "venda_ff": return [T("s_" + k, {p: P(JVC[md.mod])}), T("s_venda_d")];
    case "vendaT": return [T("s_vendaT", {p: P(CVENDA_T)}), T("s_venda_d")];
    case "com": return [T("s_com", {p: P(JVC.com)}), T("s_com_d")];
    case "cv": return [T("s_cv"), T("s_cv_d", {a: P(JVC.mkt), b: P(JVC.gc), c: P(JVC.fech)})];
    case "margem": return [T("s_margem", {p: pct(x.m)}), T("s_margem_d")];
    case "margemT": return [T("s_margemT", {p: pct(c.mT)}), T("s_margemT_d")];
    case "saida": return [T("s_saida", {p: P(CSAIDA)}), T("s_saida_d")];
    case "proj": return [T("s_proj"), T("s_proj_d", {p: P(JVC.proj), v: din(JVC.projMin)})];
    case "obraFf": return [T("s_obraFf"), x.reforma != null ? T("s_obraFfX") : T("s_obraFf_d", {nv: T({leve: "nvLeve", media: "nvMedia", geral: "nvGeral"}[c.nv] || "nvGeral"), pp: din(c.pp), a: nf(x.area)})];
    case "obraFs": return [T("s_obraFs"), T("s_obraFs_d", {pp: din(JVC.limpeza), a: nf(x.area)})];
    case "adm": return [T("s_adm"), md.mod === "ff" ? T("s_admFf_d", {p: P(JVC.adm)}) : T("s_admFs_d", {v: din(JVC.admMin), p: P(JVC.admArv)})];
    case "fixos": return [T("s_fixos"), T("s_fixos_d", {f: din(CFIXOS), q: c.qt ? T("s_fixos_q", {v: din(c.qt)}) : "",
      l: md.lic ? T("s_fixos_l", {v: din(md.lic), p: P(JVC.lic), m: din(JVC.licMin)}) : ""})];
    case "fixosT": return [T("s_fixosT"), T("s_fixosT_d", {f: din(CFIXOS), q: c.qt ? T("s_fixos_q", {v: din(c.qt)}) : ""})];
    case "divida": return [T("s_divida"), T("s_divida_d")];
    case "juros": return [T("s_juros"), T("s_juros_d", {p: pct(11)})];
    case "premio": return [T("s_premio", {p: pct(x.premio, 2)}), T("s_premio_d")];
    case "teto": return [T("s_teto"), ""];
  }
  return [k, ""];
}
let ULTIMA = null;   // para o teste
function desenha(){
  const x = le_form();
  document.querySelectorAll("[data-so=casa]").forEach(e => e.hidden = TIPO !== "casa");
  $("#rotArv").textContent = T(TIPO === "terreno" ? "arvT" : "arv");
  $("#dicaArv").textContent = T(TIPO === "terreno" ? "arvDicaT" : "arvDica");
  $("#dicaMargem").textContent = TIPO === "terreno" ? T("margemDicaT", {m: pct(x.m + CMARG_T)}) : T("margemDicaC");
  $("#inQt").disabled = !x.titulo;
  $("#dicaQt").textContent = T("qtDica", {uf: x.uf, v: din(QT[x.uf] ?? QT0)});
  const okIn = x.arv > 0 && (TIPO === "terreno" || x.area > 0);
  const tetoEl = $("#teto"), res = $("#res");
  if (!okIn) {
    ULTIMA = null; res.removeAttribute("data-teto");
    tetoEl.textContent = "–"; tetoEl.classList.remove("neg");
    $("#exato").textContent = T(TIPO === "terreno" ? "faltaT" : "falta");
    $("#veredito").hidden = true; $("#kpis").innerHTML = ""; $("#kpiNota").textContent = ""; $("#mods").innerHTML = "";
    $("#casc").innerHTML = ""; $("#conta").textContent = "";
    return;
  }
  const c = conta(x); ULTIMA = {x, c};
  res.dataset.teto = String(c.teto); res.dataset.tetoArred = String(arred(c.teto)); res.dataset.base = String(c.base);
  const fecha = c.teto > 0;
  tetoEl.textContent = fecha ? din(arred(c.teto)) : T("naoFecha");
  tetoEl.classList.toggle("neg", !fecha);
  $("#exato").textContent = fecha ? T("exato", {v: din(c.teto)}) : T("naoFechaTxt");
  // veredito contra o lance de abertura
  const v = $("#veredito"); v.hidden = false;
  if (x.abertura > 0) { const d = c.teto - x.abertura;
    v.className = "veredito " + (d >= 0 ? "ok" : "bad"); v.textContent = T(d >= 0 ? "vOk" : "vBad", {d: din(Math.abs(d))}); }
  else { v.className = "veredito neu"; v.textContent = T("vNeu"); }
  // indicadores no lance de abertura (ou no teto)
  const L = x.abertura > 0 ? x.abertura : fecha ? c.teto : null;
  if (L != null) { const e = c.em(L), cl = e.lucro >= 0 ? "pos" : "neg";
    $("#kpis").innerHTML = [[T("kLance"), din(e.L), ""], [T("kTotal"), din(e.total), ""], [T("kLucro"), din(e.lucro), cl],
      [T("kRet"), e.ret == null ? "—" : pct(e.ret * 100) + "%", cl], [T("kMarg"), e.margem == null ? "—" : pct(e.margem * 100) + "%", cl]]
      .map(([a, b, k]) => `<div><span>${esc(a)}</span><b class="${k}">${esc(b)}</b></div>`).join("");
    $("#kpiNota").textContent = (x.abertura > 0 ? T("kpiAt", {v: din(x.abertura)}) : T("kpiTeto")) + " " + T("kpiDef");
  } else { $("#kpis").innerHTML = ""; $("#kpiNota").textContent = ""; }
  // as duas modalidades
  if (c.tipo === "casa") {
    const cols = c.ff ? [c.fs, c.ff] : [c.fs], nm = md => T(md.mod === "ff" ? "modFf" : "modFs");
    const tb = t => t > 0 ? din(t) : T("naoFecha");
    $("#mods").innerHTML = `<table class="mods"><caption class="nota" style="text-align:left">${esc(T("modT"))}</caption>
      <tr><th></th>${cols.map(md => `<th class="${md === c.m ? "esc" : ""}">${esc(nm(md))}${md === c.m ? " · " + esc(T("modEsc")) : ""}</th>`).join("")}</tr>
      <tr><td>${esc(T("modVenda"))}</td>${cols.map(md => `<td>${esc(din(md.V))}</td>`).join("")}</tr>
      <tr><td>${esc(T("modTeto"))}</td>${cols.map(md => `<td>${esc(tb((md.bmax - x.divida) / (1 + x.premio / 100)))}</td>`).join("")}</tr></table>`;
  } else $("#mods").innerHTML = "";
  // cascata: cada degrau na escala do ARV
  const it = c.passos.filter(p => p[2] || Math.round(p[1]));
  const lo = Math.min(0, c.teto), hi = x.arv, sx = t => (t - lo) / (hi - lo) * 100;
  let cur = x.arv;
  $("#casc").innerHTML = it.map(([k, val, tp]) => {
    let a, b;
    if (tp) { a = Math.min(0, val); b = Math.max(0, val); } else { a = cur + val; b = cur; cur = a; }
    const [nome, det] = textoPasso(k, c, x), w = Math.max(.6, sx(b) - sx(a));
    const vtxt = tp ? (tp === "f" && val <= 0 ? T("naoFecha") : din(val)) : (val > 0 ? "+" : "−") + din(Math.abs(val));
    return `<li class="${tp || ""}${tp === "f" && val <= 0 ? " neg" : ""}" data-passo="${k}" data-v="${val}"><div>${esc(nome)}${det ? `<small>${esc(det)}</small>` : ""}</div>
      <div class="bar" aria-hidden="true"><i style="left:${sx(a).toFixed(2)}%;width:${w.toFixed(2)}%"></i></div><div class="v">${esc(vtxt)}</div></li>`;
  }).join("");
  // a fórmula em uma linha
  const xs = (x.divida ? T("contaX1") : "") + (x.premio && c.tipo === "casa" ? T("contaX2", {b: pct(x.premio, 2)}) : "");
  $("#conta").textContent = c.tipo === "casa"
    ? T("contaC", {pv: pct(JVC[c.m.mod] * 100), c: pct(JVC.com * 100), cv: pct((JVC.mkt + JVC.gc + JVC.fech) * 100), m: pct(x.m), x: xs})
      + " " + T("contaMax", {m: T(c.m.mod === "ff" ? "modFf" : "modFs")})
    : T("contaT", {pv: pct(CVENDA_T * 100), m: pct(c.mT), s: pct(CSAIDA * 100), x: x.divida ? T("contaX1") : "", j: pct(CJ * 100, 2),
      b: x.premio ? T("contaX3", {b: pct(x.premio, 2)}) : ""});
}
function desenhaParam(){
  const P = v => pct(v * 100);
  const lin = [["p_fs", T("v_fs", {p: P(JVC.fs)})], ["p_ff", T("v_fs", {p: P(JVC.ff)})], ["p_com", P(JVC.com) + "%"],
    ["p_cv", `${P(JVC.mkt)}% + ${P(JVC.gc)}% + ${P(JVC.fech)}%`], ["p_m", pct(CONTA0.m) + "%"],
    ["p_adm", T("v_adm", {a: P(JVC.adm), m: din(JVC.admMin), b: P(JVC.admArv)})], ["p_proj", T("v_proj", {p: P(JVC.proj), m: din(JVC.projMin)})],
    ["p_lic", T("v_lic", {p: P(JVC.lic), m: din(JVC.licMin)})], ["p_limp", T("v_limp", {v: din(JVC.limpeza)})], ["p_fixos", din(CFIXOS)],
    ["p_qt", T("v_qt", {pa: din(QT.PA), mi: din(QT.MI), ny: din(QT.NY), ar: din(QT.AR), o: din(QT0)})],
    ["p_rep", T("v_rep", {l: din(CONTA0.p.leve), m: din(CONTA0.p.media), g: din(CONTA0.p.geral)})], ["p_nivel", T("v_nivel")],
    ["p_terra", T("v_terra", {v: P(CVENDA_T), s: P(CSAIDA)})]];
  $("#param").innerHTML = lin.map(([k, v]) => `<tr><td>${esc(T(k))}</td><td>${esc(v)}</td></tr>`).join("");
}
function aplicaLang(l){
  LANG = l === "pt" ? "pt" : "en"; guarda("blr_lang", LANG);
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  document.title = T("titulo_pag");
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = T(e.dataset.i); });
  document.querySelectorAll("[data-ih]").forEach(e => { e.innerHTML = T(e.dataset.ih); });   // só texto do próprio dicionário
  document.querySelectorAll("[data-ip]").forEach(e => { e.placeholder = T(e.dataset.ip); });
  document.querySelectorAll("[data-it]").forEach(e => { e.title = T(e.dataset.it); e.setAttribute("aria-label", T(e.dataset.it)); });
  desenhaParam(); desenha();
}

/* ---------- tema ---------- */
(function(){ const t = le("blr_tema") || le("blr_semana_tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
$("#btTema").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const novo = atual === "light" ? "dark" : "light"; document.documentElement.setAttribute("data-theme", novo); guarda("blr_tema", novo);
});

/* ---------- início ---------- */
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => aplicaLang(b.dataset.lang)));
document.querySelectorAll("[data-tipo]").forEach(b => b.addEventListener("click", () => {
  TIPO = b.dataset.tipo === "terreno" ? "terreno" : "casa";
  document.querySelectorAll("[data-tipo]").forEach(y => y.setAttribute("aria-pressed", y.dataset.tipo === TIPO));
  desenha();
}));
F.addEventListener("input", desenha);
F.addEventListener("change", desenha);
F.addEventListener("submit", e => e.preventDefault());
montaUf();
checaI18n();
{ const q = new URLSearchParams(location.search).get("lang"), nav = String(navigator.language || "").toLowerCase();
  aplicaLang(q === "pt" || q === "en" ? q : le("blr_lang") || le("blr_semana_lang") || (nav.startsWith("pt") ? "pt" : "en")); }
window.BLRCalc = {conta, modDe, nivelAno, arred, CONTA0, QT, QT0, CJ, CSAIDA, CFIXOS, CTIP, CVENDA_T, CMARG_T, JVC, ultima: () => ULTIMA};
</script>
