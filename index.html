<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#F4F6F7">
<title>Vitrine BLR</title>
<meta name="description" content="Leilões de imóveis por dívida nos EUA, com o teto de lance calculado pela BLR Developments.">
<link rel="icon" type="image/svg+xml" href="/blr-icon-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../vendor/topojson.min.js"></script>
<script src="../vendor/leaflet.min.js"></script>
<script src="/assinar/planos.js"></script>
<script>try{ const t = localStorage.getItem("blr_novo_tema"); if(t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  else if(matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; }catch(e){}</script>
<style>
/* Vitrine nova (13/11/2026): guia de design da Gallery (GUIA-DESIGN.md), aprovado pelo Cris. Tokens só aqui; nenhum componente usa cor literal. */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px;font:inherit}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control-container .leaflet-top,.leaflet-control-container .leaflet-bottom{position:absolute;z-index:800;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both;pointer-events:auto;position:relative;z-index:800}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-tooltip{position:absolute;padding:6px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;white-space:nowrap;pointer-events:none;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.leaflet-interactive{cursor:pointer}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-control-zoom a{display:grid;place-items:center;width:34px;height:34px;background:var(--surface);color:var(--ink);text-decoration:none;font:600 18px var(--f-b);border:1px solid var(--line)}
.leaflet-control-zoom a:first-child{border-radius:10px 10px 0 0}.leaflet-control-zoom a:last-child{border-radius:0 0 10px 10px;border-top:0}

:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --sunk:#EBEFF1; --ink:#13212B; --muted:#5B6B76; --line:#DDE3E7;
  --accent:#0E7A64; --accent-ink:#FFFFFF; --accent-soft:rgba(14,122,100,.1); --amber:#B8741E; --amber-soft:rgba(184,116,30,.12); --bad:#B4413A; --bad-soft:rgba(180,65,58,.1);
  --m0:#E6ECEE; --m1:#C5DDD5; --m2:#8CC3B1; --m3:#46A189; --m4:#0E7A64;
  --f-d:'Schibsted Grotesk',system-ui,sans-serif; --f-b:'Inter',system-ui,sans-serif; --f-m:'JetBrains Mono',ui-monospace,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --ease:cubic-bezier(.2,.7,.2,1); --sombra:0 10px 30px rgba(19,33,43,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#151F26; --sunk:#1B262E; --ink:#E6EDF0; --muted:#93A3AD; --line:#26333C;
  --accent:#3CC29F; --accent-ink:#06261E; --accent-soft:rgba(60,194,159,.13); --amber:#E2A650; --amber-soft:rgba(226,166,80,.14); --bad:#E57F76; --bad-soft:rgba(229,127,118,.12);
  --m0:#1B262E; --m1:#1E3B37; --m2:#246052; --m3:#2E8D74; --m4:#3CC29F; --sombra:0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-b);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.015em;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-m)}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}

/* cabeçalho */
.top{position:sticky;top:0;z-index:1000;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:var(--s4);height:64px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 20px var(--f-d)}
.marca i{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.marca small{font:500 13px var(--f-b);color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:var(--s4)}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.nav a:hover{color:var(--ink)}
.dir{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.ic{padding:0;width:38px;height:38px;justify-content:center}
.anel{--p:0;width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;font:600 11px var(--f-b);transition:--p .9s var(--ease)}
.anel b{width:18px;height:18px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:10.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.peq{padding:8px 14px;font-size:14px}
.inferior{display:none}
@media (max-width:820px){
  .nav,.top .marca small,.top .so-desk{display:none}
  #xpTxt{display:none}.pill#xpChip{padding:6px}.top .wrap{gap:var(--s2)}
  .inferior{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .inferior a{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
  .inferior a[aria-current="page"]{color:var(--accent);font-weight:600}
  .inferior svg{width:22px;height:22px}
  body{padding-bottom:76px}
}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--s6);align-items:center;padding:var(--s7) 0 var(--s6)}
.eyebrow{font:600 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.12;margin:12px 0 14px}
.hero p{color:var(--muted);font-size:17px;max-width:560px;margin:0 0 22px}
.hero .acoes{display:flex;gap:var(--s3);flex-wrap:wrap}
.hero .viz{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);aspect-ratio:4/3;overflow:hidden}
.hero .viz svg{position:absolute;inset:0;width:100%;height:100%}
.hero .viz .nota-t{position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--sombra)}
.hero .viz .nota-t small{display:block;color:var(--muted);font-size:13px}
.hero .viz .nota-t b{font:700 22px var(--f-d)}
.hero .fecha{position:absolute;right:12px;top:12px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:var(--s5)}.hero .viz{aspect-ratio:16/9}}
.kpis{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s5);color:var(--muted);font-size:14px}
.kpis b{display:block;font:700 24px var(--f-d);color:var(--ink)}

/* passos */
.passos{display:flex;align-items:center;gap:var(--s4);border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 16px;margin:var(--s4) 0}
.passos .barras{display:flex;gap:4px}.passos .barras i{width:22px;height:5px;border-radius:3px;background:var(--sunk)}.passos .barras i.ok{background:var(--accent)}
.passos .txt{flex:1;font-size:14px}.passos .txt b{font-weight:600}
@media (max-width:820px){.passos{padding:8px 8px 8px 14px;gap:8px}.passos .barras,.passos .btn{display:none}.passos .txt{font-size:13.5px}#mapaInfo{display:none}}

/* filtros */
.filtros{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s4) 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.chip b{font:500 12.5px var(--f-m);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--surface);opacity:.75}
.filtros .esp{flex:1}
.troca{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.troca input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.troca input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .26s var(--ease)}
.troca input:checked{background:var(--accent);border-color:var(--accent)}.troca input:checked::after{transform:translateX(16px)}
.escopo{font-size:13px;color:var(--muted);margin:-6px 0 var(--s3)}
@media (max-width:820px){.filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.filtros::-webkit-scrollbar{display:none}.filtros .esp{display:none}}

/* explorar */
.explorar{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s4);margin-bottom:var(--s7)}
.painel{border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;min-width:0}
.painel>header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:14px 18px;border-bottom:1px solid var(--line)}
.painel>header h2{font-size:19px}
.painel>header small{color:var(--muted)}
#mapa{height:min(68vh,620px);background:var(--bg)}
.lista{max-height:min(68vh,620px);overflow:auto}
@media (max-width:820px){.explorar{grid-template-columns:1fr}#mapa{height:52vh}.lista{max-height:none}}
.linha{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:var(--ink);transition:background .15s}
.linha:hover{background:var(--sunk)}
.mini{width:56px;height:56px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.mini svg{width:44px;height:44px}
.linha h3{font:600 15px var(--f-b);margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .sub{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.tag.breve{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.acima{background:var(--bad-soft);color:var(--bad)}
.linha .val{text-align:right}
.linha .val small{display:block;color:var(--muted);font-size:12px}
.linha .val b{font:700 16px var(--f-d)}
.linha .val .teto{color:var(--amber);font-size:12.5px;font-weight:600}
.vazio{padding:var(--s6) var(--s5);color:var(--muted);text-align:center}
.mais{display:block;width:100%;padding:14px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer}
.carr{padding:var(--s6);text-align:center;color:var(--muted)}
.uf-rot{display:inline-block;transform:translateX(-50%);margin-left:30px;font:700 11px var(--f-b);color:var(--ink);text-align:center;line-height:1.15;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 6px;white-space:nowrap}
.uf-rot small{display:block;font:500 10.5px var(--f-m);color:var(--muted)}

/* drawer de filtros */
.veu{position:fixed;inset:0;background:rgba(19,33,43,.32);z-index:1500;opacity:0;pointer-events:none;transition:opacity .26s}
.veu.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:1600;transform:translateX(100%);transition:transform .26s var(--ease);padding:var(--s5);overflow:auto;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer h2{font-size:22px;margin-bottom:var(--s4)}
.campo{display:grid;gap:6px;margin-bottom:var(--s4);font-size:14px;font-weight:500}
.campo select,.campo input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.drawer .rod{display:flex;gap:var(--s2);margin-top:var(--s5)}

/* ficha */
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:1600;transform:translateX(100%);transition:transform .26s var(--ease);overflow:auto;border-left:1px solid var(--line)}
.ficha.on{transform:none}
.ficha header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:var(--s3);align-items:flex-start;z-index:2}
.ficha header h2{font-size:21px;line-height:1.2}
.ficha header small{color:var(--muted)}
.ficha header .x{margin-left:auto}
.ficha .corpo{padding:var(--s4) 18px var(--s7)}
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
.k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.k small{display:block;color:var(--muted);font-size:12.5px}
.k b{font:700 22px var(--f-d)}
.k.amber b{color:var(--amber)}
.k .barra{height:6px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.k .barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s var(--ease)}
.k .tr{font-size:13px;color:var(--muted)}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s4);margin-top:var(--s4)}
.bloco h3{font-size:17px;margin-bottom:var(--s2)}
.bloco p{margin:0 0 8px;color:var(--muted)}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.det dt{color:var(--muted)}.det dd{margin:0;font-weight:500}
.contorno{display:grid;place-items:center;background:var(--sunk);border-radius:12px;height:220px;overflow:hidden;position:relative}
.contorno svg{width:70%;height:80%}
.contorno svg polygon{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.2;stroke-dasharray:var(--len,800);stroke-dashoffset:var(--len,800);animation:desenha 1.2s var(--ease) forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.midia{margin:0 0 var(--s4)}
.midia figure{margin:0 0 var(--s3)}
.midia .q{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9}
.midia iframe,.midia img{display:block;width:100%;height:100%;border:0;object-fit:cover}
.midia .q svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.midia figcaption{color:var(--muted);font-size:12px;margin-top:6px}
.contorno img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trava{display:flex;gap:12px;align-items:center;background:var(--amber-soft);border-radius:12px;padding:12px 14px;margin-top:var(--s3);font-size:14px}
.trava .btn{margin-left:auto}
.facoes{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}

/* páginas */
.pag{padding:var(--s6) 0 var(--s7)}
.pag>h1{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.pag>.sub{color:var(--muted);margin:0 0 var(--s5);max-width:640px}
.ciclo{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:var(--s5)}
.ciclo button{border:0;background:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.ciclo button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.planos{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}
@media (max-width:980px){.planos{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.planos{grid-template-columns:1fr}}
.plano{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s5);display:flex;flex-direction:column;gap:10px;position:relative;transition:box-shadow .2s,transform .2s var(--ease)}
.plano:hover{box-shadow:var(--sombra);transform:translateY(-2px)}
.plano.dest{border:2px solid var(--accent)}
.plano .selo{position:absolute;top:-12px;left:18px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.plano h2{font-size:22px}
.plano .quem{color:var(--muted);font-size:14px;margin-top:-6px}
.plano .preco{font:800 30px var(--f-d)}.plano .preco small{font:500 14px var(--f-b);color:var(--muted)}
.plano ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.plano li{display:grid;grid-template-columns:18px 1fr;gap:6px}.plano li::before{content:"✓";color:var(--accent);font-weight:700}
.plano .btn{margin-top:auto}
.compara{margin-top:var(--s6);display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media (max-width:700px){.compara{grid-template-columns:1fr}}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s5)}
.cartao h3{margin-bottom:6px}
.cartao p{color:var(--muted);margin:0}
.grade2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.nivel{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
.nivel .grande{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;transition:--p .9s var(--ease)}
.nivel .grande div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font:700 26px var(--f-d)}
.nivel .grande small{display:block;font:500 12px var(--f-b);color:var(--muted)}
.selos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.selo-c{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:center;opacity:.55}
.selo-c.ganho{opacity:1;border-color:var(--accent)}
.selo-c i{font-size:26px;font-style:normal;display:block}
.selo-c b{display:block;font-size:14px;margin-top:4px}.selo-c small{color:var(--muted);font-size:12px}
.dias{display:flex;gap:6px;margin-top:var(--s3)}.dias i{width:18px;height:18px;border-radius:5px;background:var(--sunk)}.dias i.on{background:var(--accent)}
.rodape{border-top:1px solid var(--line);padding:var(--s5) 0 var(--s6);color:var(--muted);font-size:13px}
.rodape .wrap{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:center}
.rodape a{color:var(--muted)}
.rodape .classico{margin-left:auto}

/* IA e toast */

.toast.on{opacity:1;transform:translate(-50%,0)}
.toast:empty{display:none}
@media (max-width:820px){.toast{bottom:calc(90px + env(safe-area-inset-bottom))}}

<script>
"use strict";
/* ====================================================================================================================
   CONTEUDO: todo texto, preço, plano, link e regra de XP da página fica aqui (Cris 13/11: "mexer fácil").
   ==================================================================================================================== */
const CONTEUDO = {
  nav: [["explorar", "Explorar", "M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14"], ["meus-lotes", "Meus lotes", "M6 3h12v18l-6-4-6 4z"],
        ["aprender", "Aprender", "M2 9l10-5 10 5-10 5z M6 11v5c3 2 9 2 12 0v-5"], ["planos", "Planos", "M3 6h18v12H3z M3 10h18"]],
  hero: {eyebrow: "BLR Developments", titulo: "Leilões de imóveis por dívida nos EUA, com o teto de lance já calculado.",
         texto: "A BLR junta num mapa só os leilões de imposto atrasado, execução de hipoteca e imóveis de banco e de governo dos EUA. Você abre o lote e vê quanto vale, quanto deve e até quanto vale a pena dar de lance.",
         principal: "Testar 7 dias grátis", secundario: "Explorar o mapa"},
  /* login próprio (13/11): mesmas rotas e textos da versão clássica */
  conta: {entrarTxt: "Use o e-mail e a senha do seu acesso BLR.",
          testeTxt: "Só e-mail e telefone, sem cartão. Você recebe um link para criar a senha e, por 7 dias, vê tudo o que o assinante Pro vê.",
          testeItens: ["Endereço, posição exata, contorno do lote e Street View", "Teto de lance BLR, ARV e a conta de cada lote", "Assistente de IA da BLR"],
          termosVersao: "2026-11-11",
          sms: "Quero receber novidades e oportunidades da BLR por SMS/WhatsApp (opcional). A frequência varia; podem incidir tarifas de mensagem e dados. Responda SAIR/STOP para parar e AJUDA/HELP para ajuda. Não é condição para usar a plataforma."},
  grupos: [
    {id: "imposto", nome: "Imposto atrasado", ids: ["tax_deed", "tax_lien", "upset"], sigla: "Tax deed, tax lien e upset sale"},
    {id: "execucao", nome: "Execução de hipoteca", ids: ["foreclosure", "sheriff_judicial"], sigla: "Foreclosure e sheriff sale"},
    {id: "gov", nome: "Banco ou governo", ids: ["reo", "governo_federal"], sigla: "REO e imóveis de agência federal"},
    {id: "terras", nome: "Banco de terras", ids: ["land_bank"], sigla: "Land bank do condado ou da cidade"},
    {id: "outros", nome: "Outros", ids: ["nao_informado"], sigla: "Tipo não informado no edital"}],
  tipos: {
    tax_deed: ["Tax deed", "O condado vende o imóvel por imposto atrasado e quem arremata recebe a escritura."],
    tax_lien: ["Tax lien", "Você compra o certificado da dívida de imposto, não o imóvel. O retorno vem dos juros do resgate."],
    upset: ["Upset sale", "Venda por imposto em que a hipoteca e alguns ônus podem sobreviver ao leilão."],
    foreclosure: ["Foreclosure", "Execução da hipoteca, no tribunal ou em trustee sale: o credor cobra a dívida vendendo o imóvel."],
    sheriff_judicial: ["Sheriff sale", "Leilão do xerife, por imposto ou por execução, com regras do tribunal do condado."],
    land_bank: ["Land bank", "Venda direta do banco de terras do condado ou da cidade, em geral com exigência de uso."],
    reo: ["REO", "Imóvel que ficou com o banco e é vendido do estoque dele."],
    governo_federal: ["Governo federal", "Imóvel de agência federal (HUD, VA e outras), vendido direto, não em leilão."],
    nao_informado: ["Tipo não informado", "O edital não trouxe um tipo de venda reconhecível. Confira no edital oficial."]},
  passos: [["estado", "Escolha um estado"], ["lote", "Abra um lote"], ["teto", "Veja um teto de lance"], ["salvar", "Acompanhe um lote"], ["guia", "Leia um guia"]],
  /* planos, preços e payment links: fonte única em /assinar/planos.js (a mesma do checkout embutido) */
  planos: window.BLR_PLANOS.planos,
  stripe: window.BLR_PLANOS.stripe,
  compara: [["Ferramenta comum", "Uma calculadora. O lance e o risco ficam por sua conta."], ["BLR", "O teto de lance já calculado no Pro e, no UltraPro, a BLR comprando junto com você."]],
  aprender: [["../tutoriais/", "O primeiro lance, passo a passo", "Do edital ao arremate em cada tipo de leilão."], ["../por-que-blr/", "Por que BLR", "A jornada em 4 passos: achar, arrematar, reformar e lucrar."],
             ["../checklist/", "Checklist de terrenos", "Os pontos que separam um bom negócio de um prejuízo."]],
  glossario: [["Abertura", "O lance mínimo do leilão, em geral a dívida mais as custas."], ["Teto de lance BLR", "Até quanto vale a pena dar de lance para o negócio fechar com margem, pela conta da BLR."],
              ["ARV", "After Repair Value: quanto o imóvel vale depois de reformado, pelas vendas reais do entorno."], ["Cadastro", "O valor do imóvel no cadastro do condado (assessed/just value)."],
              ["Resgate", "Prazo em que o dono ainda pode pagar a dívida e ficar com o imóvel."]],
  xp: {lote_aberto: 10, estado_explorado: 15, teto_calculado: 25, lote_acompanhado: 5, guia_lido: 20},
  niveis: [["Curioso", 0], ["Estudante", 100], ["Investidor", 250], ["Arrematador", 500], ["Sócio BLR", 900]],
  selos: [["primeiro", "Primeiro lote", "🏠", "Abriu o primeiro lote"], ["explorador", "Explorador", "🧭", "3 estados explorados"], ["calculista", "Calculista", "🧮", "3 tetos de lance vistos"],
          ["colecao", "Colecionador", "⭐", "5 lotes acompanhados"], ["aluno", "Aluno", "🎓", "3 guias lidos"], ["semana", "Semana firme", "🔥", "7 dias seguidos"]],
  ia: {sugestoes: ["Quais os próximos leilões?", "Como funciona um tax deed?", "Qual plano é melhor para mim?"]},
  classicoHref: "/classico/"
};

/* ---------- utilidades ---------- */
const API = "https://api.blrdevelopment.com";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const USD = new Intl.NumberFormat("pt-BR", {style: "currency", currency: "USD", maximumFractionDigits: 0});
const usd = v => v == null || isNaN(v) ? "—" : USD.format(v);
const n0 = v => Number(v || 0).toLocaleString("pt-BR");
const LS = {get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
            set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};
const REDUZ = matchMedia("(prefers-reduced-motion: reduce)").matches;
function conta(el, ate, fmt){ if(!el) return; fmt = fmt || n0; if(REDUZ){ el.textContent = fmt(ate); return; }
  const t0 = performance.now(), de = 0; const f = t => { const x = Math.min(1, (t - t0) / 800), v = de + (ate - de) * (1 - Math.pow(1 - x, 3)); el.textContent = fmt(Math.round(v)); if(x < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function entra(els){ if(REDUZ || !els.length) return; [...els].slice(0, 14).forEach((e, i) => e.animate([{transform: "translateY(10px)", opacity: .001}, {transform: "none", opacity: 1}], {duration: 380, delay: i * 40, easing: "cubic-bezier(.2,.7,.2,1)", fill: "backwards"})); }
let tToast = 0;
function toast(t){ if(!t || ESTADO.prefs.avisos_xp === false) return; const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tToast); tToast = setTimeout(() => { el.classList.remove("on"); setTimeout(() => { if(!el.classList.contains("on")) el.textContent = ""; }, 300); }, 2600); }
async function busca(u, o){ const r = await fetch(u, o); if(!r.ok) throw Object.assign(new Error(u + " " + r.status), {st: r.status}); return r.json(); }
const api = (r, corpo) => fetch(API + r, corpo ? {method: "POST", credentials: "include", headers: {"Content-Type": "application/json", ...(EU && EU.csrf ? {"X-CSRF": EU.csrf} : {})}, body: JSON.stringify(corpo)} : {credentials: "include"})
  .then(async x => { const j = await x.json().catch(() => ({})); if(!x.ok) throw Object.assign(new Error(j.mensagem || "falha"), {st: x.status, erro: j.erro}); return j; });

/* ---------- dados (os mesmos arquivos da versão clássica) ---------- */
let DADOS = null, EUA = null, HOJE = "", L = [], CARREGADO = false, EU = null, ASSIN = false, PREM = {}, PRIV = {};
const ESTADO = {grupo: "", crit: false, sd: false, uf: "", max: 0, dias: 0, mostrar: 40, prefs: {avisos_xp: true}};
const TXT_CAMPOS = ["nt", "fo", "jvq", "tp", "u", "mc", "pa"];
const REGRAS_TIPO = [["upset", /upset/i], ["reo", /\breo\b|real estate owned|bank-owned|bank owned|homepath|homesteps|fannie|freddie/i], ["sheriff_judicial", /sheriff|(?<!non-)judicial/i],
  ["governo_federal", /\bhud\b|\bva\b|usda|\bgsa\b|marshals|tesouro|treasury/i], ["land_bank", /land\s*bank|repositor|adjudicat/i], ["tax_lien", /\bliens?\b|certificate|certificado/i],
  ["tax_deed", /tax\s*deed|tax\s*foreclos|tax\s*forfeit/i], ["foreclosure", /foreclos|trustee/i]];
function tipoId(l){ const tp = String(l.tp || "").toLowerCase(), md = String(l.md || "").toLowerCase();
  for(const [id, re] of REGRAS_TIPO) if(re.test(tp)) return id;
  if(md === "governo") return "governo_federal"; if(!tp && l.uf === "FL") return "tax_deed"; return "nao_informado"; }
const grupoDe = l => (CONTEUDO.grupos.find(g => g.ids.includes(l._t)) || CONTEUDO.grupos[CONTEUDO.grupos.length - 1]).id;
const HIST = l => !!l.h, LIST = l => l.et === "listado", CRIT = l => l.et === "final";
const SEMDADO = l => LIST(l) && (!!l.li || (l.desc == null && !(l.ab && l.jv)));
const chavePriv = l => (l.uf + "_" + l.co).replace(/ /g, "_").replace(/\./g, "").replace(/'/g, "");
const prem = l => (PREM[l.uf] || {})[l.i] || null;
const priv = l => (PRIV[chavePriv(l)] || {})[l.i] || null;
const diasAte = d => d ? Math.round((new Date(d + "T12:00:00") - new Date(HOJE + "T12:00:00")) / 864e5) : null;
const quando = l => { const n = diasAte(l.d); return n == null ? "data a confirmar" : n < 0 ? "já leiloado" : n === 0 ? "leilão hoje" : n === 1 ? "leilão amanhã" : `leilão em ${n} dias`; };
const titulo = l => { const p = ASSIN && priv(l); return p && p.e ? p.e.replace(/\s+\d{5}$/, "") : `Lote em ${l.ci || l.co}`; };
const lugar = l => `${l.ci ? l.ci + ", " : ""}${l.uf} · condado de ${l.co}`;
const teto = l => { const p = ASSIN && prem(l); return p && p.t != null ? p.t : null; };

function prepara(x){ for(const l of x.lotes || []){ for(const c of TXT_CAMPOS) if(Number.isInteger(l[c])) l[c] = x.txt[l[c]]; l._t = tipoId(l); l._g = grupoDe(l); L.push(l); } }
/* ---------- conta, assinatura e progresso ---------- */
async function descompacta(p){ if(p && p.z) p = await new Response(new Blob([Uint8Array.from(atob(p.z), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("gzip"))).json(); return p || {}; }
async function conta_(){
  try{ EU = await api("/api/me"); }catch(e){ EU = null; }
  if(!EU || !EU.email){ EU = null; return; }
  ESTADO.prefs = {avisos_xp: EU.avisos_xp !== false, preferencia_ui: EU.preferencia_ui || "novo"};
  pintaConta();
  if(EU.premium === true){
    try{
      const ufs = Array.isArray(EU.estados) ? EU.estados.filter(u => /^[A-Z]{2}$/.test(u)) : null;
      const pacs = ufs ? await Promise.all(ufs.map(u => api("/api/premium?uf=" + u).then(descompacta))) : [await api("/api/premium").then(descompacta)];
      for(const p of pacs){ Object.assign(PREM, p.premium || {}); Object.assign(PRIV, p.privado || {}); }
      ASSIN = Object.keys(PREM).length > 0;
    }catch(e){ ASSIN = false; }
  }
  await importaVisitante();
}
/* XP: no servidor para quem tem conta (POST /api/progresso/evento); no navegador para visitante, levado para a conta no 1º login */
const PROG_LOCAL = "blr_novo_eventos";
let PROG = null;
function progressoLocal(){
  const ev = LS.get(PROG_LOCAL, []), vistos = new Set(), xp = ev.reduce((s, e) => { const k = e.tipo + ":" + (e.alvo || ""); if(vistos.has(k)) return s; vistos.add(k); return s + (CONTEUDO.xp[e.tipo] || 0); }, 0);
  const tem = t => ev.some(e => e.tipo === t), qt = t => new Set(ev.filter(e => e.tipo === t).map(e => e.alvo)).size;
  const dias = new Set(ev.filter(e => e.tipo === "visita").map(e => e.alvo));
  const ni = CONTEUDO.niveis.reduce((a, n, i) => xp >= n[1] ? i : a, 0);
  let seq = 0; for(let i = 0; i < 60; i++){ const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); if(dias.has(d)) seq++; else if(i) break; }
  const sg = []; if(tem("lote_aberto")) sg.push({id: "primeiro"}); if(qt("estado_explorado") >= 3) sg.push({id: "explorador"}); if(qt("teto_calculado") >= 3) sg.push({id: "calculista"});
  if(qt("lote_acompanhado") >= 5) sg.push({id: "colecao"}); if(qt("guia_lido") >= 3) sg.push({id: "aluno"}); if(seq >= 7) sg.push({id: "semana"});
  const passos = {estado: tem("estado_explorado"), lote: tem("lote_aberto"), teto: tem("teto_calculado"), salvar: tem("lote_acompanhado"), guia: tem("guia_lido"),
                  faixa_dispensada: tem("faixa_dispensada"), hero_dispensado: tem("hero_dispensado")};
  passos.feitos = ["estado", "lote", "teto", "salvar", "guia"].filter(k => passos[k]).length; passos.total = 5;
  return {xp, nivel: {indice: ni, nome: CONTEUDO.niveis[ni][0], min: CONTEUDO.niveis[ni][1]}, xp_proximo: (CONTEUDO.niveis[ni + 1] || [0, null])[1], selos_ganhos: sg, passos,
          sequencia: {atual: seq, dias: Array.from({length: 14}, (_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(0, 10); return {dia: d, ativo: dias.has(d)}; })}};
}
async function carregaProgresso(){ if(EU){ try{ PROG = await api("/api/progresso"); }catch(e){ PROG = progressoLocal(); } } else PROG = progressoLocal(); pintaXP(); }
async function evento(tipo, alvo){
  const ev = LS.get(PROG_LOCAL, []), envia = alvo;
  if(tipo === "visita") alvo = new Date().toISOString().slice(0, 10);   // 1 por dia; o servidor conta o dia no fuso ET
  if(ev.some(e => e.tipo === tipo && (e.alvo || "") === (alvo || ""))) return;
  if(!EU){ ev.push({tipo, alvo, ts: new Date().toISOString().slice(0, 10)}); LS.set(PROG_LOCAL, ev.slice(-200));
    const antes = PROG ? PROG.xp : 0; PROG = progressoLocal(); pintaXP(); const g = PROG.xp - antes; if(g > 0) toast(`+${g} XP`); return; }
  ev.push({tipo, alvo}); LS.set(PROG_LOCAL, ev.slice(-200));
  try{ const r = await api("/api/progresso/evento", envia ? {tipo, alvo: envia} : {tipo}); PROG = {...PROG, ...r}; pintaXP();
    if(r.ganho > 0) toast(`+${r.ganho} XP`); for(const s of r.novos_selos || []) toast(`Novo selo: ${s.nome}`); }catch(e){}

/* 14/11: fotos do lote na ficha do assinante, como na versão clássica: Street View ao vivo (vitrine_sv.py) → foto de rua do
   Mapillary (vitrine_mly.py) → fachada do cadastro → foto aérea do USGS com o contorno; mais o satélite do bairro, onde houver */
function capaAerea(la, ln, pol){
  const R = 6378137, X = g => R * g * Math.PI / 180, Y = g => R * Math.log(Math.tan(Math.PI / 4 + g * Math.PI / 360));
  const W = 800, H = 450, temPol = Array.isArray(pol) && pol.length > 2;
  let cx = X(ln), cy = Y(la), hx = 120 / Math.cos(la * Math.PI / 180), hy = hx * H / W;
  if(temPol){ const xs = pol.map(q => X(q[1])), ys = pol.map(q => Y(q[0])), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    cx = (x0 + x1) / 2; cy = (y0 + y1) / 2; hx = Math.max(hx, (x1 - x0) / 2 * 1.2, (y1 - y0) / 2 * 1.2 * W / H); hy = hx * H / W; }
  const bb = `bbox=${cx - hx},${cy - hy},${cx + hx},${cy + hy}&bboxSR=3857&imageSR=3857&size=${W},${H}&format=jpg&f=image`;
  const url = `https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/export?${bb}`,
        url2 = `https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?${bb}`;
  const px = (a, o) => [((X(o) - (cx - hx)) / (2 * hx) * W).toFixed(1), (((cy + hy) - Y(a)) / (2 * hy) * H).toFixed(1)];
  const forma = temPol ? `<polygon points="${pol.map(([a, o]) => px(a, o).join(",")).join(" ")}" fill="rgba(242,193,78,.18)" stroke="#F2C14E" stroke-width="3"/>`
    : `<circle cx="${W / 2}" cy="${H / 2}" r="34" fill="none" stroke="#F2C14E" stroke-width="3" stroke-dasharray="8 6"/><circle cx="${W / 2}" cy="${H / 2}" r="5" fill="#F2C14E"/>`;
  return `<figure><div class="q"><img src="${url}" data-alt2="${url2}" onerror="if(this.dataset.alt2){this.src=this.dataset.alt2;this.dataset.alt2=''}" alt="Foto aérea do lote" loading="lazy">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${forma}</svg></div>
    <figcaption>Foto aérea (USGS, domínio público)${temPol ? " · contorno da parcela no cadastro" : " · círculo = posição do lote"}</figcaption></figure>`;
}
function midiaLote(l, p, pv, pos){
  const sv = pv && pv.sv, mly = pv && pv.mly, img = (p && p.img) || {}, fs = [];
  if(sv && sv.p) fs.push(`<figure><div class="q"><iframe src="https://www.google.com/maps/embed?pb=!4v1!6m8!1m7!1s${encodeURIComponent(sv.p)}!2m2!1d${sv.la}!2d${sv.ln}!3f${sv.h}!4f0!5f0.78" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Street View"></iframe></div>
    <figcaption>Street View ao vivo (Google${sv.ano ? ", foto de " + esc(sv.ano) : ""})${sv.m != null ? " · a " + esc(sv.m) + " m do centro do lote" : ""} · arraste para girar</figcaption></figure>`);
  else if(mly && mly.id) fs.push(`<figure><div class="q"><iframe src="https://www.mapillary.com/embed?image_key=${encodeURIComponent(mly.id)}&style=photo" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Foto de rua (Mapillary)"></iframe></div>
    <figcaption>Foto de rua · © Mapillary contributors (CC-BY-SA 4.0)${mly.ano ? ", foto de " + esc(mly.ano) : ""}${mly.m != null ? " · a " + esc(mly.m) + " m do centro do lote" : ""}</figcaption></figure>`);
  else if(img.f) fs.push(`<figure><div class="q"><img src="/${esc(String(img.f).replace(/^\/+/, ""))}" alt="Fachada" loading="lazy" onerror="this.closest('figure').remove()"></div><figcaption>Fachada · ${esc(img.ff || "cadastro do condado")}</figcaption></figure>`);
  else if(pos) fs.push(capaAerea(pos[0], pos[1], pv && pv.pol));
  if(img.s) fs.push(`<figure><div class="q"><img src="/${esc(String(img.s).replace(/^\/+/, ""))}" alt="Vista aérea do bairro com as ruas e o contorno do lote" loading="lazy" onerror="this.closest('figure').remove()"></div><figcaption>Satélite com as ruas, ~400 m de largura · USGS NAIP + Censo TIGER</figcaption></figure>`);
  return fs.length ? `<div class="bloco midia"><h3>Fotos do lote</h3>${fs.join("")}</div>` : "";
}

        : er.st === 429 ? msgErro(er, "Muitas tentativas. Espere 15 minutos.") : "O login não respondeu agora. Tente de novo em instantes."; return; }
    fechaModal(); await posLogin(); };
}
async function posLogin(){
  if(VOLTA){ location.href = VOLTA; return; }
  PREM = {}; PRIV = {}; ASSIN = false;
  await conta_();
  if(!EU){ toast("Você entrou, mas a conta não abriu agora. Atualize a página."); return; }
  const el = $("#toast"); el.textContent = `Olá, ${primeiroNome()}!`; el.classList.add("on"); clearTimeout(tToast); tToast = setTimeout(() => el.classList.remove("on"), 2600);
  await carregaProgresso();
  if($("#explorarPag")){ explorar(); } else rota();
  if(location.hash.startsWith("#lote-")) abreFicha(location.hash.slice(6));
}
const primeiroNome = () => EU ? String(EU.nome || EU.email || "Conta").split(/[ @]/)[0] : "";
function pintaConta(){
  const b = $("#btEntrar");
  if(EU){ b.textContent = primeiroNome() + " ▾"; b.setAttribute("aria-haspopup", "menu"); b.title = EU.email || ""; }
  else { b.textContent = "Entrar"; b.setAttribute("aria-haspopup", "dialog"); b.title = ""; }
}
function menuConta(){
  let m = $("#uMenu"); const b = $("#btEntrar");
  if(m){ m.remove(); b.setAttribute("aria-expanded", "false"); return; }
  const plano = EU.teste ? "teste grátis do Pro" : EU.plano ? ((CONTEUDO.planos.find(p => p.id === EU.plano) || {}).nome || String(EU.plano)) : "";
  m = document.createElement("div"); m.id = "uMenu"; m.className = "umenu"; m.setAttribute("role", "menu");
  m.innerHTML = `<div class="quem"><b>${esc(EU.nome || primeiroNome())}</b><small>${esc(EU.email || "")}</small>${plano ? `<small>Plano: ${esc(plano)}</small>` : ""}</div>
    <a href="#progresso" role="menuitem">Meu progresso</a><a href="#meus-lotes" role="menuitem">Meus lotes</a>
    <a href="../conta/" role="menuitem">Minha conta</a><a href="#planos" role="menuitem">Planos</a>
    ${Array.isArray(EU.estados) && EU.estados_limite ? `<a href="/classico/" role="menuitem">Meus estados (${esc(EU.estados.join(", ") || "escolher")})</a>` : ""}
    ${EU.papel === "admin" ? `<a href="../admin/" role="menuitem">Administrar usuários</a>` : ""}
    <button type="button" class="sair" role="menuitem" id="btSair">Sair da conta</button>`;
  document.body.appendChild(m);
  const r = b.getBoundingClientRect(); m.style.top = (r.bottom + 8) + "px"; m.style.right = Math.max(8, innerWidth - r.right) + "px";
  b.setAttribute("aria-expanded", "true");
  $("#btSair").onclick = sair;
  m.addEventListener("click", e => { if(e.target.closest("a")) m.remove(); });
  setTimeout(() => document.addEventListener("click", function fora(ev){ if(ev.target.closest("#uMenu")) return;
    document.removeEventListener("click", fora); const x = $("#uMenu"); if(x){ x.remove(); b.setAttribute("aria-expanded", "false"); } }), 0);
}
function sair(){ const bt = $("#btSair"); if(bt){ bt.disabled = true; bt.textContent = "Saindo…"; }
  // os eventos guardados aqui já foram para a conta: limpa, para não passarem para a conta de outra pessoa neste navegador
  api("/api/logout", {}).catch(() => {}).finally(() => { LS.set(PROG_LOCAL, []); LS.set("blr_novo_importado", false); location.reload(); }); }
function abreEsqueci(email0){
  abreModal(`<h2 id="mTit">Criar uma senha nova</h2><p>Digite o e-mail do seu acesso. Se ele tiver acesso, você recebe um link (vale por pouco tempo e uma vez só) para escolher a senha nova.</p>
    <form id="fEsq"><label class="campo">E-mail<input name="email" type="email" autocomplete="username" required value="${esc(email0 || "")}"></label>
      <button class="btn pri" type="submit">Receber o link</button><div class="erro" id="mErro" role="alert"></div></form>
    <div class="rodap"><span><button type="button" class="lnk" data-entrar>Voltar para entrar</button></span></div>`);
  $("#fEsq").onsubmit = async e => { e.preventDefault(); const email = String(new FormData(e.target).get("email")).trim().toLowerCase(), bt = e.target.querySelector("button[type=submit]");
    bt.disabled = true; bt.textContent = "Enviando…";
    try{ const r = await api("/api/esqueci", {email});
      abreModal(`<h2 id="mTit">Confira o seu e-mail</h2><p>${r && r.mensagem ? esc(r.mensagem) : `Se ${esc(email)} tiver acesso BLR, o link para criar a senha nova chega em alguns minutos. Veja também a caixa de spam.`}</p><button class="btn pri" type="button" data-fm>Fechar</button>`); }
    catch(er){ bt.disabled = false; bt.textContent = "Receber o link";
      $("#mErro").textContent = er.st === 429 ? msgErro(er, "Muitos pedidos. Espere 15 minutos.") : er.st && er.st < 500 ? msgErro(er, "Confira o e-mail digitado.") : "O pedido não foi agora. Tente de novo em instantes."; } };
}
function abreCadastro(){
  if(EU){ location.hash = "planos"; return; }
  const c = CONTEUDO.conta;
  abreModal(`<h2 id="mTit">Teste grátis por 7 dias</h2><p>${esc(c.testeTxt)}</p>
    <ul style="margin:0 0 var(--s4);padding-left:20px;display:grid;gap:4px">${c.testeItens.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <form id="fTeste"><label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
      <label class="campo">Telefone / WhatsApp (com o código do país)<input name="telefone" type="tel" autocomplete="tel" required minlength="8" placeholder="+1 617 000 0000"></label>
      <label class="aceite"><input type="checkbox" name="termos" required> <span>Li e aceito os <a href="../termos/" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="../privacy/" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>
      <label class="aceite"><input type="checkbox" name="sms"> <span>${esc(c.sms)}</span></label>
      <button class="btn pri" type="submit">Começar o teste</button><div class="erro" id="mErro" role="alert"></div></form>
    <div class="rodap"><span>Já tem acesso? <button type="button" class="lnk" data-entrar>Entrar</button></span></div>`);
  $("#fTeste").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target), bt = e.target.querySelector("button[type=submit]");
    const email = String(f.get("email")).trim().toLowerCase(), tel = String(f.get("telefone")).trim();
    bt.disabled = true; bt.textContent = "Enviando…";
    // aceite dos Termos e consentimento de SMS vão com data e versão (11/11, padrão da clássica)
    const aceite = {termos: c.termosVersao, aceito_em: new Date().toISOString(), sms_marketing: !!f.get("sms")};
    try{ await api("/api/cadastro", {email, telefone: tel, aceite});
      abreModal(`<h2 id="mTit">Quase lá ✓</h2><p>Mandamos para <b>${esc(email)}</b> o link para criar a sua senha. O teste de 7 dias começa quando você entrar.</p><button class="btn pri" type="button" data-fm>Fechar</button>`); }
    catch(er){ bt.disabled = false; bt.textContent = "Começar o teste";
      $("#mErro").textContent = er.st === 429 ? msgErro(er, "Muitas tentativas. Espere alguns minutos.") : er.st === 409 ? msgErro(er, "Este e-mail já tem acesso. Entre ou peça uma senha nova.")
        : er.st && er.st < 500 ? msgErro(er, "Confira o e-mail e o telefone.") : "O cadastro não respondeu agora. Tente de novo em instantes."; } };
}
document.addEventListener("click", e => {
  const ass = e.target.closest("[data-assina]");
  if(ass){ e.preventDefault(); abreEntrar(assinarHref(ass.dataset.assina)); }
  else if(e.target.closest("[data-teste]")){ e.preventDefault(); abreCadastro(); }
  else if(e.target.closest("[data-entrar]")){ e.preventDefault(); e.stopPropagation(); abreEntrar(); }
});

/* ---------- tema, versão clássica, XP ---------- */
$("#btTema").onclick = () => { const d = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = d; try{ localStorage.setItem("blr_novo_tema", d); }catch(e){} if(MAPA){ if(CAM_CO && MAPA.hasLayer(CAM_CO)) MAPA.removeLayer(CAM_CO); CAM_CO = null; pintaMapa(); } };
$("#btClassico").onclick = async e => { e.preventDefault(); try{ localStorage.setItem("blr_ui", "classico"); }catch(er){} if(EU) await api("/api/preferencias", {preferencia_ui: "classico"}).catch(() => {}); location.href = CONTEUDO.classicoHref; };
$("#xpChip").onclick = () => { location.hash = "progresso"; };
const L_ = window.L;

/* ---------- início ---------- */
/* 13/11: a nova é a raiz. Links antigos (?plano, volta do Stripe ?assinatura, ?senha...) abrem as telas da clássica;
   quem escolheu a clássica (neste navegador ou na conta) vai para ela. ?entrar e ?teste agora abrem aqui (login próprio). */
const PARAMS_CLASSICO = ["assinatura", "plano", "ciclo", "falar", "senha", "listas", "tour"];
const PARAM_ABRE = (() => { const q = new URLSearchParams(location.search); return q.has("entrar") ? "entrar" : q.has("teste") ? "teste" : ""; })();
const PARAM_VOLTA = voltaOk(new URLSearchParams(location.search).get("volta"));
const UI_LOCAL = (() => { try{ return localStorage.getItem("blr_ui"); }catch(e){ return null; } })();
if(PARAMS_CLASSICO.some(k => new URLSearchParams(location.search).has(k)) || UI_LOCAL === "classico") location.replace("/classico/" + location.search + location.hash);
(async function inicio(){
  if(UI_LOCAL === "classico") return;
  try{ await carregaDadosIndice(); }catch(e){ $("#app").innerHTML = `<p class="vazio">Não foi possível carregar os dados (${esc(e.message)}). Recarregue a página.</p>`; return; }
  PROG = progressoLocal(); pintaXP(); rota();
  conta_().then(async () => {
    if(EU && EU.preferencia_ui === "classico" && UI_LOCAL !== "novo"){ location.replace("/classico/"); return; }
    if(EU && UI_LOCAL === "novo" && EU.preferencia_ui === "classico") api("/api/preferencias", {preferencia_ui: "novo"}).catch(() => {});
    if(EU) document.querySelectorAll("#hero [data-teste]").forEach(x => x.remove());
    if(PARAM_ABRE){ try{ history.replaceState(null, "", location.pathname + location.hash); }catch(e){}
      if(PARAM_ABRE === "entrar") abreEntrar(PARAM_VOLTA); else if(!EU) abreCadastro(); }
    await carregaProgresso(); evento("visita", undefined); const h = location.hash; if(ASSIN && CARREGADO){ pintaMapa(); lista(); } if(h.startsWith("#lote-")) abreFicha(h.slice(6)); else if(!h || h === "#explorar"){ const pb = $("#passosBox"); if(pb){ pb.innerHTML = passosHTML(); ligaPassos(); } } });
  carregaResto().then(() => { if($("#explorarPag")){ chips(); pintaMapa(); lista(); } else rota(); if(location.hash.startsWith("#lote-")) abreFicha(location.hash.slice(6)); });
})();
async function carregaDadosIndice(){
  const a = await busca("../atual.json");
  [DADOS, EUA] = await Promise.all([busca("../" + a.DADOS), busca("../" + a.EUA)]);
  try{ HOJE = new Date().toLocaleDateString("en-CA", {timeZone: "America/New_York"}); }catch(e){ HOJE = new Date().toISOString().slice(0, 10); }
}
async function carregaResto(){
  const fila = [...(DADOS.partes || [])];
  const um = async () => { while(fila.length){ const p = fila.shift(); try{ prepara(await busca("../" + p.a)); }catch(e){ console.warn(e); } } };
  await Promise.all([um(), um(), um(), um()]);
  CARREGADO = true;
}
