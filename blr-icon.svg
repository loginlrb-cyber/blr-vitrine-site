<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vitrine BLR">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1D2330"/>
      <stop offset="1" stop-color="#0C0E12"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CF7A"/>
      <stop offset=".55" stop-color="#E8B04B"/>
      <stop offset="1" stop-color="#B97F22"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#E8B04B" stroke-opacity=".28" stroke-width="4"/>
  <!-- grade de mapa (lotes) -->
  <g stroke="#E8B04B" stroke-opacity=".10" stroke-width="3">
    <path d="M64 330H448M64 390H448M140 300V470M372 300V470"/>
  </g>
  <!-- sombra do pino -->
  <ellipse cx="256" cy="452" rx="62" ry="12" fill="#000" opacity=".45"/>
  <!-- pino de mapa -->
  <path d="M256 448C206 384 112 304 112 214A144 144 0 1 1 400 214C400 304 306 384 256 448Z" fill="url(#ouro)"/>
  <path d="M256 448C206 384 112 304 112 214A144 144 0 0 1 256 70V448Z" fill="url(#brilho)" opacity=".5"/>
  <!-- casa recortada no pino -->
  <path d="M256 128L346 206H322V292H190V206H166Z" fill="#0C0E12" stroke="#0C0E12" stroke-width="10" stroke-linejoin="round"/>
  <!-- chaminé -->
  <rect x="296" y="140" width="18" height="40" rx="3" fill="#0C0E12"/>
  <!-- porta em forma de fechadura (a chave do imóvel) -->
  <circle cx="256" cy="232" r="17" fill="url(#ouro)"/>
  <path d="M246 240H266L274 288H238Z" fill="url(#ouro)"/>
